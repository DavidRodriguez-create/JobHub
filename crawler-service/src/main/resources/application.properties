quarkus.http.port=8081
# Location filter: see locations.txt

# ── Internal service-to-service auth (story #582, ADR 0033) ────────────────────
# Guards every /internal/* path with a pre-shared X-Service-Key header (ADR 0008
# pattern). Must match the value job-service's crawler-service rest client sends.
jobhub.internal.service-key=${JOBHUB_INTERNAL_SERVICE_KEY:dev-internal-service-key}

# EnrichmentConfig (@ConfigMapping prefix="crawler.enrichment") only maps the
# providers[N] list (ADR 0004); crawler.enrichment.enabled/batch-size/max-attempts/cron
# below are plain @ConfigProperty lookups under the same prefix. Without this, SmallRye's
# unused-property validation for the mapping fails the build (SRCFG00050).
quarkus.config.mapping.validate-unknown=false

# REST client timeouts
quarkus.rest-client.read-timeout=30000

# Salary extraction — amounts below this (annual, in the source currency) are
# ignored so we don't mistake e.g. a "£1,000 learning budget" for pay.
crawler.salary.min-annual=10000

# Approximate FX rates -> EUR for the rough salary estimate stored in
# compensation_min/max. Ballpark only; the original figure stays in the description.
crawler.fx.gbp=1.17
crawler.fx.usd=0.92
crawler.fx.chf=1.04
crawler.fx.sek=0.087
crawler.fx.nok=0.086
crawler.fx.dkk=0.134
crawler.fx.pln=0.23
crawler.fx.cad=0.68

# ── Maintenance ───────────────────────────────────────────────────────────────
# One-off: on startup, rewrite stored job descriptions that still hold HTML into plain
# text (same cleaning new crawls apply). Idempotent — enable, redeploy once, then set
# back to false. Off by default.
crawler.maintenance.clean-descriptions=${CRAWLER_MAINTENANCE_CLEAN_DESCRIPTIONS:false}
crawler.maintenance.clean-descriptions-batch-size=${CRAWLER_MAINTENANCE_CLEAN_BATCH_SIZE:200}

# One-off (story #408 / ADR 0021): on startup, re-normalize job_post.city/country (country
# spelling/ISO-code/alias collapse, bare US-state resolution, qualifier stripping, preserve-raw
# fallback) via LocationNormalizer, and rewrite the matching job_post_location child rows.
# Idempotent, ascending-id-cursor bounded (enable, redeploy once, then set back to false).
crawler.maintenance.normalize-locations=${CRAWLER_MAINTENANCE_NORMALIZE_LOCATIONS:false}
crawler.maintenance.normalize-locations-batch-size=${CRAWLER_MAINTENANCE_NORMALIZE_LOCATIONS_BATCH_SIZE:200}

# ── Crawl batch stop conditions (ADR 0016) ─────────────────────────────────────
# A run keeps crawling until cumulative new posts >= min-new-posts, OR targets
# visited >= max-targets-per-run (safety cap), OR no source is available.
crawler.crawl.min-new-posts=100
crawler.crawl.max-targets-per-run=200

# ── Admin trigger (Story #7 / ADR 0003) ────────────────────────────────────────
# TriggerRequestScheduler polls crawler.trigger_request (written by job-service's
# admin endpoints) and runs the matching crawl/enrichment use case.
crawler.trigger.poll-cron=${CRAWLER_TRIGGER_POLL_CRON:0/10 * * * * ?}

# ── Shutdown-safe run reaping (story #398 / ADR 0032) ───────────────────────────
# A running trigger_request row older than this is interrupted by the live sweep
# without waiting for a restart (the startup pass covers everything non-terminal
# unconditionally). ISO-8601 duration.
crawler.trigger.stale-after=${CRAWLER_TRIGGER_STALE_AFTER:PT2H}
crawler.trigger.reaper-sweep-cron=${CRAWLER_TRIGGER_REAPER_SWEEP_CRON:10s}

# Bounded drain (D1): once ShutdownEvent fires, ShutdownSignalAdapter blocks here for up to
# this long, waiting for any in-flight crawl/enrichment batch to actually exit its loop,
# before interrupting whatever is still running, marking it interrupted, and letting Quarkus
# proceed to close the EntityManagerFactory. 25s: a typical single crawl HTTP fetch (job-board
# JSON APIs) finishes well inside this even on a slow response, without reaching all the way
# to quarkus.rest-client.read-timeout's 30s ceiling above. LLM enrichment calls routinely
# exceed it (Gemma models can take 30-60s+, Ollama minutes) -- for those, hitting this timeout
# and interrupting is the expected, normal path, not an edge case: the interrupted call fails
# quietly (CrawlerService/EnrichmentService/TriggerRequestScheduler all treat an exception
# raised after the shutdown signal is up as expected, not a fault) and the row is marked
# interrupted regardless of whether the drain finished cleanly or timed out. Kept comfortably
# below quarkus.shutdown.timeout below, so the observer itself is never cut off mid-drain.
# ISO-8601 duration.
crawler.shutdown.drain-timeout=${CRAWLER_SHUTDOWN_DRAIN_TIMEOUT:PT25S}

# Raised from Quarkus's 10s default so the ShutdownEvent observer above has room to actually
# run its drain (up to drain-timeout) plus the interrupt/reap call before Quarkus's own
# shutdown watchdog stops waiting on it. Compose/orchestrator stop grace periods must stay
# above this.
quarkus.shutdown.timeout=${QUARKUS_SHUTDOWN_TIMEOUT:30s}

# ── SmartRecruiters source client (story #270) ─────────────────────────────────
# Page cap per crawl cycle for the postings list endpoint (limit=100 per page).
# Reaching the cap is a success with partial data, not a failure (see ADR/spec).
crawler.smartrecruiters.max-pages=${CRAWLER_SMARTRECRUITERS_MAX_PAGES:5}

# ── LLM enrichment ────────────────────────────────────────────────────────────
# Async pass that fills employment_type, career_level, languages, requirements
# and normalises location from the posting text. Reads `pending` rows, writes the
# derived fields, and stamps enrichment_status — it never recomputes content_hash.
crawler.enrichment.enabled=true
crawler.enrichment.batch-size=5
crawler.enrichment.max-attempts=3
crawler.enrichment.cron=0/30 * * * * ?

# Failure backoff (story #537): a scheduled pass that attempts >=1 job and enriches 0
# is a failure; consecutive failures push the next scheduled attempt out additively
# (step, 2*step, 3*step, ...), capped at max-minutes, reset by any pass with >=1
# success. Global to the pass, not per job_post row (see ADR/spec #537). Admin-triggered
# enrichment (TriggerRequestScheduler, kind=ENRICHMENT) bypasses the backoff check but
# still feeds its outcome into it. enabled=false, or step/max of 0, disables it.
crawler.enrichment.backoff.enabled=true
crawler.enrichment.backoff.step-minutes=30
crawler.enrichment.backoff.max-minutes=120

# ── LLM enrichment — provider chain (ADR 0004) ──────────────────────────────────
# Providers are tried in declaration order (index 0 first). Each provider declares
# a type (gemini | openai | ollama) that determines the HTTP client and request
# format. A provider is skipped when enabled=false or when its api-key is blank
# (except ollama, which needs no key).
#
# Backward-compatible default: Gemini hosted chain only, Ollama disabled.

# Gemini (hosted, primary). gemini-3.1-flash-lite answers in ~2s, but the Gemma
# models in the chain are *thinking* models (no way to disable it) and can take
# 30-60s+, so the read-timeout is generous; the fast model never waits this long
# anyway. Each free-tier model has its own daily request cap (RPD), so when the
# first model's quota is spent the next is used. gemini-3.1-flash-lite ~500 RPD
# (full features); gemma-4-31b-it ~1500 RPD but with no systemInstruction/JSON
# mode (handled automatically for gemma*). Exact ids come from GET /v1beta/models
# — display names differ (e.g. "Gemma 4 26B" is the model id gemma-4-26b-a4b-it,
# NOT gemma-4-26b-it).
crawler.enrichment.providers[0].name=gemini
crawler.enrichment.providers[0].type=gemini
crawler.enrichment.providers[0].base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
crawler.enrichment.providers[0].api-key=${GEMINI_API_KEY:}
crawler.enrichment.providers[0].models=${CRAWLER_ENRICHMENT_HOSTED_MODELS:gemini-3.1-flash-lite,gemma-4-31b-it,gemma-4-26b-a4b-it}
# Per-model cooldown: after a model fails (e.g. a 429 once its daily quota is spent),
# pause THAT model for this many minutes and move to the next, recovering automatically.
# The free-tier daily quota resets ~midnight PT, so tens of minutes recovers within the
# hour of a reset; raise it to retry a dead quota less often.
crawler.enrichment.providers[0].cooldown-minutes=${CRAWLER_ENRICHMENT_HOSTED_COOLDOWN_MINUTES:30}
crawler.enrichment.providers[0].read-timeout-ms=${GEMINI_READ_TIMEOUT:90000}
crawler.enrichment.providers[0].enabled=true
# A model that is reachable but keeps replying with prose instead of parseable JSON
# (seen on Gemma models) is otherwise retried forever at up to read-timeout-ms per
# call. After this many CONSECUTIVE unusable replies, the model enters the same
# cooldown a transport failure would (#556). A successful parse resets the count.
crawler.enrichment.providers[0].unusable-reply-strikes=${CRAWLER_ENRICHMENT_UNUSABLE_REPLY_STRIKES:3}

# Ollama — opt-in local fallback. Disabled by default so the container does not
# need to run. Enable by setting CRAWLER_OLLAMA_ENABLED=true in .env and starting
# the ollama compose profile. llama3.2 (3B) — qwen2.5:1.5b was too weak (missed
# explicit salaries, employment type, seniority even on clean text); the 3B model
# extracts those reliably. Pull it once: `ollama pull llama3.2`. Override via
# CRAWLER_ENRICHMENT_MODEL (e.g. qwen2.5:1.5b for a more CPU-constrained box).
crawler.enrichment.providers[1].name=ollama
crawler.enrichment.providers[1].type=ollama
crawler.enrichment.providers[1].base-url=${OLLAMA_BASE_URL:http://localhost:11434}
crawler.enrichment.providers[1].api-key=
crawler.enrichment.providers[1].models=${CRAWLER_ENRICHMENT_MODEL:llama3.2}
crawler.enrichment.providers[1].cooldown-minutes=0
# 10 min: CPU-only Ollama can take minutes for one chat call (large prompt + the
# first call also loads the model). The default 120s makes such calls time out and
# the row gets marked failed. Lower this where Ollama runs on a GPU.
crawler.enrichment.providers[1].read-timeout-ms=600000
crawler.enrichment.providers[1].enabled=${CRAWLER_OLLAMA_ENABLED:false}

# Example: adding DeepSeek (or any OpenAI-compatible provider) — just append a
# new indexed entry in .env / application-prod.properties:
#
# crawler.enrichment.providers[2].name=deepseek
# crawler.enrichment.providers[2].type=openai
# crawler.enrichment.providers[2].base-url=https://api.deepseek.com
# crawler.enrichment.providers[2].api-key=${DEEPSEEK_API_KEY:}
# crawler.enrichment.providers[2].models=deepseek-chat
# crawler.enrichment.providers[2].cooldown-minutes=30
# crawler.enrichment.providers[2].read-timeout-ms=60000
# crawler.enrichment.providers[2].enabled=true

# OllamaClient extends the generated ChatApi (in the api-contracts jar). The
# programmatic rest-client builder only sees the inherited @POST/@Path if that
# jar is indexed.
quarkus.index-dependency.api-contracts.group-id=com.davidcreate.jobhub
quarkus.index-dependency.api-contracts.artifact-id=api-contracts

# Logging
quarkus.log.category."com.davidcreate.jobhub".level=INFO

# Statement-level adapter logging (UPSERT/UPDATE/INSERT lines, per-source "found N jobs").
# INFO hides them; set CRAWLER_ADAPTER_LOG_LEVEL=DEBUG to get the SQL-level detail back
# without a rebuild (quarkus.log.min-level defaults to DEBUG). Story #513 / ADR 0029.
quarkus.log.category."com.davidcreate.jobhub.crawler.adapter.out".level=${CRAWLER_ADAPTER_LOG_LEVEL:INFO}

# Attach MaskingLogFilter (@LoggingFilter name) to the console handler so personal
# data / secrets are redacted from every line. @LoggingFilter only registers the
# filter — this key is what actually binds it to the handler.
quarkus.log.console.filter=masking-log-filter

# HTTP access log — one line per incoming request (host, user, "METHOD path proto", status, bytes, time)
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %u "%r" %s %b %D ms
quarkus.http.record-request-start-time=true

# Per-endpoint request/response logging (RequestLoggingFilter): handler name + masked
# JSON payload + status + latency. Payloads are capped at body-limit chars; personal
# data is redacted by MaskingLogFilter. Disable with request-log.enabled=false.
jobhub.http.request-log.enabled=true
jobhub.http.request-log.body-limit=2000

# Slow-request WARN: one WARNING per request whose latency reaches the threshold, independent
# of request-log.enabled (works even with verbose per-endpoint logging switched off).
jobhub.http.slow-request.enabled=true
jobhub.http.slow-request.threshold-ms=1000