# application-dev.properties

# Database — Dev Services auto-starts Postgres container
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.reuse=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.init-script-path=db/init-dev.sql

# Hibernate
quarkus.hibernate-orm.database.default-schema=crawler
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=db/dev-seeds.sql
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true

# Crawler

# CrawlerScheduler runs every 10 minutes (fires at min 0,10,20,30,40,50)
crawler.crawl.cron=0 0/10 * * * ?
# Dev: lower targets so a local run completes quickly
crawler.crawl.min-new-posts=10
crawler.crawl.max-targets-per-run=20

# EnrichmentScheduler runs every 10 minutes, offset by 5 minutes from CrawlerScheduler
# (interleaves at min 5,15,25,35,45,55; overrides the base 30s loop in %dev)
crawler.enrichment.cron=0 5/10 * * * ?
crawler.enrichment.batch-size=10

crawler.failure.cooldown-minutes=11
crawler.failure.cooldown-rate-limit-hours=0
crawler.failure.cooldown-unavailable-minutes=11
crawler.failure.cooldown-not-found-days=0

# Swagger
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger

# Dev mode always shows statement-level adapter detail, unconditionally (story #513 / ADR 0029):
# no CRAWLER_ADAPTER_LOG_LEVEL override needed while developing locally.
quarkus.log.category."com.davidcreate.jobhub.crawler.adapter.out".level=DEBUG