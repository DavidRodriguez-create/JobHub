
# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=3
quarkus.datasource.username=${DATABASE_USERNAME}
quarkus.datasource.password=${DATABASE_PASSWORD}

# Hibernate
quarkus.hibernate-orm.database.generation=validate

# Crawler

# CrawlerScheduler runs every 5 hours
crawler.crawl.cron=0 0/5 * * * ?
# Keep crawling until 100 new posts are found (or all sources are exhausted).
# Safety cap: visit at most 200 sources per run.
crawler.crawl.min-new-posts=100
crawler.crawl.max-targets-per-run=200

# EnrichmentScheduler drains `pending` rows every 15 minutes -- decoupled from the
# crawl cadence; it just picks up whatever the crawler has produced. Overlapping runs
# are skipped (concurrentExecution=SKIP), so batch-size is an upper bound per pass.
crawler.enrichment.cron=0 0/15 * * * ?
crawler.enrichment.batch-size=70

crawler.failure.cooldown-minutes=15
crawler.failure.cooldown-rate-limit-hours=1
crawler.failure.cooldown-unavailable-minutes=30
crawler.failure.cooldown-not-found-days=1
