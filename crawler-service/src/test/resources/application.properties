quarkus.application.name=crawler-service-test
quarkus.http.test-port=0

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.init-script-path=db/init-test.sql

quarkus.hibernate-orm.database.default-schema=crawler
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=db/test-seeds.sql
quarkus.hibernate-orm.log.sql=false

crawler.failure.cooldown-minutes=15
crawler.failure.cooldown-rate-limit-hours=1
crawler.failure.cooldown-unavailable-minutes=30
crawler.failure.cooldown-not-found-days=1

quarkus.scheduler.enabled=false
