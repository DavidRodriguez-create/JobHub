name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# paths-filter calls the PR "list files" API, which needs pull-requests:read.
# Without this block the default token is contents:read only → "Resource not
# accessible by integration". Jobs only read the repo, so this is least-privilege.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'pom.xml'
              - 'api-contracts/**'
              - 'crawler-service/**'
              - 'job-service/**'
              - 'auth-service/**'
              - 'application-service/**'
              - 'notification-service/**'
              - 'db/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'JobHub-ui/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JobHub-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: JobHub-ui/package.json

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: JobHub-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (no-op until the UI test script lands on the target branch)
        run: pnpm run --if-present test:run

      - name: Build
        run: pnpm run build
