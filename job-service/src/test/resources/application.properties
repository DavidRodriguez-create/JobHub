quarkus.application.name=job-service-test
quarkus.http.test-port=0

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.init-script-path=db/init-test.sql

quarkus.hibernate-orm.database.default-schema=crawler
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=db/test-seeds.sql
quarkus.hibernate-orm.log.sql=false

# Story #333 (#405): Hibernate statistics for the anti-N+1 statement-count assertion
# (JobPostSearchN1ComponentTest). Test profile only — never enabled in dev/prod.
quarkus.hibernate-orm.statistics=true

# JWT — same keys/issuer as auth-service, plus a signing key so tests can mint tokens
mp.jwt.verify.publickey.location=META-INF/keys/publicKey.pem
mp.jwt.verify.issuer=jobhub-auth
smallrye.jwt.sign.key.location=META-INF/keys/privateKey.pem
smallrye.jwt.new-token.issuer=jobhub-auth

job.search.max-size=100
job.search.default-size=20

# Admin crawl/enrichment trigger (Story #7 / ADR 0003; 2FA gate: ADR 0019) — default profile: enabled.
jobhub.admin.trigger.enabled=true

# Company resolution reconciler (Story #428 / ADR 0023 D5) - DISABLED in the default test
# profile. Story #429 fixed a real bug (CompanyEntity.slug had no unique=true, so the
# DevServices drop-and-create test schema had no constraint for upsertBySlug's own
# "ON CONFLICT (slug)" to match - every scheduled run silently errored out and did
# nothing). Quarkus's @Scheduled(every = ...) fires its FIRST execution almost immediately
# at CDI startup regardless of how long the interval is - a long interval does NOT delay
# that first fire - so once the ON CONFLICT bug was fixed, the scheduler started actually
# resolving pending pull targets (e.g. Northwind Freight) during every test class's
# startup, silently breaking QAE-428-C-06's "stays unresolved" assumption. Disabled here;
# CompanyResolutionSchedulerTest (Mockito) already covers the scheduler's own
# enabled/disabled branching, and component tests that need a real resolve call
# ResolveCompaniesUseCase.resolvePending() explicitly (CompanyLogoResolutionComponentTest,
# CompanyLogoConfigComponentTest), each in its own isolated @TestProfile container.
job.company.resolve.enabled=false
job.company.resolve.every=15m
job.company.resolve.batch-size=200

# auth-service REST client — WireMock target, started per-test via WireMockAuthServerResource.
quarkus.rest-client.auth-service.url=${AUTH_SERVICE_BASE_URL:http://localhost:0}
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=1024

jobhub.internal.service-key=test-internal-key

# crawler-service REST client: WireMock target, started per-test via WireMockCrawlerServerResource.
quarkus.rest-client.crawler-service.url=${CRAWLER_SERVICE_BASE_URL:http://localhost:0}
