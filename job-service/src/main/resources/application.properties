# application.properties — shared config only, no env-specific values

quarkus.application.name=job-service
quarkus.http.port=8081

# Database schema (isolated per service for least privilege)
quarkus.hibernate-orm.database.default-schema=job

# Security: JWT verification.
# Job search/get are public (security: [] in the contract); the saved-jobs and
# saved-filters endpoints require a Bearer token minted by auth-service.
mp.jwt.verify.publickey.location=META-INF/keys/publicKey.pem
mp.jwt.verify.issuer=jobhub-auth

# Pagination
job.search.max-size=100
job.search.default-size=20