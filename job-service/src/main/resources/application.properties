# application.properties — shared config only, no env-specific values

quarkus.application.name=job-service
quarkus.http.port=8081

# Database schema (isolated per service for least privilege)
quarkus.hibernate-orm.database.default-schema=job

# Security: JWT verification.
# Job search/get are public (security: [] in the contract); the saved-jobs and
# saved-filters endpoints require a Bearer token minted by auth-service.
mp.jwt.verify.publickey.location=META-INF/keys/publicKey.pem
mp.jwt.verify.issuer=jobhub-auth

# Pagination
job.search.max-size=100
job.search.default-size=20

# Job-search count strategy (Story #331 / ADR 0018): stop paying for an exact
# COUNT(*) over the full filter predicate on every search.
#   exact   = always exact COUNT (legacy behaviour, no threshold, no estimate ever)
#   estimate = always the PostgreSQL planner row estimate, even for small result sets
#   hybrid  = estimate-above-threshold (default): exact COUNT at/below
#             exact-threshold, planner estimate above it
job.search.count.mode=hybrid
# Planner-estimate row count at/below which an exact COUNT is run; above it, the
# planner estimate itself is returned as totalElements/totalPages (mode=hybrid only).
job.search.count.exact-threshold=1000
# Short-TTL cache of the computed total (value + estimate flag), keyed on the filter
# set only (excludes page/size/sort): makes paging the same filters, and the shared
# default listing, compute the total once and reuse it.
job.search.count.cache.enabled=true
job.search.count.cache.ttl=PT30S
job.search.count.cache.max-size=1000

# Facet-response cache (Story #332 / ADR 0020): short-TTL cache of the computed
# facets payload, keyed on the filter set only (excludes page/size/sort, mirrors
# job.search.count.cache.* above), invalidated by a crawl-data generation stamp
# read cheaply from crawler.job_post. The stamp reads GREATEST(MAX(last_seen_at),
# MAX(enriched_at)), so it captures both a crawl write and the separate async
# enrichment pass that backfills the exact fields facets group by.
job.search.facets.cache.enabled=true
job.search.facets.cache.ttl=PT60S
job.search.facets.cache.max-size=500
# How often the generation stamp itself is re-read from the DB; also the
# post-change staleness window before invalidation is observed.
job.search.facets.stamp.ttl=PT10S

# Admin crawl/enrichment trigger (Story #7 / ADR 0003; 2FA gate: ADR 0019).
# "Reloadable" = change the env var and recreate the container; values are fixed
# for the life of a running container (re-read on every request, not hot-reloaded).
jobhub.admin.trigger.enabled=${JOBHUB_ADMIN_TRIGGER_ENABLED:true}

# Company resolution reconciler (Story #428 / ADR 0023 D5): batched, idempotent,
# off the read path. Resolves pull_target rows with company_id IS NULL to a stored
# crawler.company row - only ever needed for a brand-new pull target; every existing
# posting already resolves through its target's company at insert time.
job.company.resolve.enabled=true
job.company.resolve.every=15m
job.company.resolve.batch-size=200

# Company logos (Story #429 / revised ADR 0024) are NOT derived or fetched at runtime:
# they are curated, hardcoded to each company's own-site icon in db/init/052 and hand-
# filled by an admin (#430). A brand-new company is inserted with a null logo_url and
# renders the UI initials chip until curated. No logo config lives here by design.

# ── Outbound: auth-service REST client (admin 2FA gate, ADR 0019) ────────────
# Used to resolve the triggering admin's own 2FA status/verify their own TOTP or
# backup code, service-to-service against auth-service's /internal/... endpoints
# (auth-service is root-pathed at /auth — baked into AuthServiceRestClient's @Path).
quarkus.rest-client.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8082}
quarkus.rest-client.auth-service.scope=jakarta.enterprise.context.ApplicationScoped
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=1024

# Pre-shared API key required on the X-Service-Key header for auth-service's
# /internal/* endpoints (ADR 0008). Must match auth-service's own configured value.
# Used by the admin-2FA outbound calls to auth-service; must match the
# deployment-wide JOBHUB_INTERNAL_SERVICE_KEY. Story #484: job-service's own inbound
# /internal/companies/... endpoints (ServiceKeyFilter) are gone, so this key is now
# outbound-only from job-service's side. Story #583: also used for the outbound
# crawler-service trigger-request calls below.
jobhub.internal.service-key=${JOBHUB_INTERNAL_SERVICE_KEY:dev-internal-service-key}

# ── Outbound: crawler-service REST client (trigger-request writes, ADR 0033) ─────
# crawler-service is the sole writer of crawler.trigger_request (ticket #583):
# queueing and cancelling an admin pass now go through its internal endpoints
# instead of a cross-schema INSERT/UPDATE. crawler-service has no published port
# and is reachable only by its compose service hostname on the container network,
# never at localhost (job-service's own port 8081 would otherwise collide): the
# default below matches the podman-compose service name, same shape as
# AUTH_SERVICE_URL above. Override per environment via CRAWLER_SERVICE_URL.
quarkus.rest-client.crawler-service.url=${CRAWLER_SERVICE_URL:http://crawler-service:8081}
quarkus.rest-client.crawler-service.scope=jakarta.enterprise.context.ApplicationScoped

# Logging — attach MaskingLogFilter (@LoggingFilter name) to the console handler so
# personal data / secrets are redacted from every line. @LoggingFilter only registers
# the filter — this key is what actually binds it to the handler.
quarkus.log.console.filter=masking-log-filter

# HTTP access log — one line per incoming request (host, user, "METHOD path proto", status, bytes, time)
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %u "%r" %s %b %D ms
quarkus.http.record-request-start-time=true

# Per-endpoint request/response logging (RequestLoggingFilter): handler name + masked
# JSON payload + status + latency. Payloads are capped at body-limit chars; personal
# data is redacted by MaskingLogFilter. Disable with request-log.enabled=false.
jobhub.http.request-log.enabled=true
jobhub.http.request-log.body-limit=2000

# Slow-request WARN: one WARNING per request whose latency reaches the threshold, independent
# of request-log.enabled (works even with verbose per-endpoint logging switched off).
jobhub.http.slow-request.enabled=true
jobhub.http.slow-request.threshold-ms=1000