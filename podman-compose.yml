# JobHub — full local stack (PostgreSQL + 4 Quarkus services + Vite UI) — JVM mode.
#
# Backend services built as JVM containers using Dockerfile.jvm.
# Package the services first:
#     mvn -DskipTests package
#     podman compose -f podman-compose.yml up -d --build
#
# For native images, use:
#     mvn -DskipTests package -Pnative
#     podman compose -f podman-compose.native.yml up -d --build
#
# The UI runs the Vite dev server via pnpm (VITE_USE_API=true), reverse-proxying
# /auth, /jobs and /applications to the service containers — open http://localhost:5173.
#
# Reset the database (re-run db/init + db/seeds): podman compose down -v
#
# Credentials are loaded from .env (git-ignored) — do not commit secrets to the repo.
version: "3.8"

# Database configuration — each service uses its own schema with least-privilege credentials from .env
x-crawler-db: &crawler-db
  DATABASE_URL: ${CRAWLER_DATABASE_URL}
  DATABASE_USERNAME: ${CRAWLER_DATABASE_USERNAME}
  DATABASE_PASSWORD: ${CRAWLER_DATABASE_PASSWORD}

x-job-db: &job-db
  DATABASE_URL: ${JOB_DATABASE_URL}
  DATABASE_USERNAME: ${JOB_DATABASE_USERNAME}
  DATABASE_PASSWORD: ${JOB_DATABASE_PASSWORD}

x-auth-db: &auth-db
  DATABASE_URL: ${AUTH_DATABASE_URL}
  DATABASE_USERNAME: ${AUTH_DATABASE_USERNAME}
  DATABASE_PASSWORD: ${AUTH_DATABASE_PASSWORD}

x-applications-db: &applications-db
  DATABASE_URL: ${APPLICATIONS_DATABASE_URL}
  DATABASE_USERNAME: ${APPLICATIONS_DATABASE_USERNAME}
  DATABASE_PASSWORD: ${APPLICATIONS_DATABASE_PASSWORD}

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: jobhub-db
    environment:
      POSTGRES_USER: jobhub
      POSTGRES_PASSWORD: jobhub
      POSTGRES_DB: jobhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # User creation (runs as bash script with env var substitution), then schemas + seeds
      - ./db/init-users.sh:/docker-entrypoint-initdb.d/000-init-users.sh:ro
      - ./db/init/001-schemas.sql:/docker-entrypoint-initdb.d/001-schemas.sql:ro
      - ./db/init/010-crawler.sql:/docker-entrypoint-initdb.d/010-crawler.sql:ro
      - ./db/seeds/011-crawler-seeds.sql:/docker-entrypoint-initdb.d/011-crawler-seeds.sql:ro
      - ./db/init/020-auth.sql:/docker-entrypoint-initdb.d/020-auth.sql:ro
      - ./db/seeds/021-auth-seeds.sql:/docker-entrypoint-initdb.d/021-auth-seeds.sql:ro
      - ./db/init/030-applications.sql:/docker-entrypoint-initdb.d/030-applications.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhub -d jobhub"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Scheduled batch crawler — writes to the crawler schema. No published port.
  crawler-service:
    build:
      context: ./crawler-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: jobhub-crawler-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *crawler-db

  job-service:
    build:
      context: ./job-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: jobhub-job-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *job-db
    ports:
      - "8081:8081"

  auth-service:
    build:
      context: ./auth-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: jobhub-auth-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *auth-db
    ports:
      - "8082:8082"

  application-service:
    build:
      context: ./application-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: jobhub-application-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *applications-db
      # Outbound calls to the other services (snapshot a crawled job; consume a
      # delete-all-applications verification code).
      JOB_SERVICE_URL: http://job-service:8081
      AUTH_SERVICE_URL: http://auth-service:8082
    ports:
      - "8083:8083"

  # Frontend — Vite dev server run with pnpm. The proxy targets point at the
  # service containers; VITE_USE_API=true makes the app use the live backend.
  jobhub-ui:
    image: docker.io/library/node:20-alpine
    container_name: jobhub-ui
    working_dir: /app
    depends_on:
      - auth-service
      - job-service
      - application-service
    environment:
      VITE_USE_API: "true"
      VITE_AUTH_TARGET: http://auth-service:8082
      VITE_JOBS_TARGET: http://job-service:8081
      VITE_APPS_TARGET: http://application-service:8083
      # Bind-mounted source needs polling for Vite HMR (inotify doesn't cross the mount).
      VITE_POLL: "true"
    volumes:
      - ./JobHub-ui:/app
      - ui_node_modules:/app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

volumes:
  pgdata:
  ui_node_modules:
