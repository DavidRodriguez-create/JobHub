server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Defer upstream DNS resolution to request time so nginx starts without
    # the backend containers (standalone UI mode / mock data).
    resolver 127.0.0.11 valid=5s ipv6=off;

    # SPA: serve static assets, fall back to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy each backend service by path prefix.
    # Service hostnames match the container names in podman-compose.yml.
    location /auth/ {
        set $auth_upstream http://auth-service:8082;
        proxy_pass $auth_upstream/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /jobs/ {
        set $jobs_upstream http://job-service:8081;
        proxy_pass $jobs_upstream/jobs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /applications/ {
        set $apps_upstream http://application-service:8083;
        proxy_pass $apps_upstream/applications/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
