openapi: 3.0.3
info:
  title: JobHub — Notification Service
  version: 1.0.0
  description: |
    REST API for managing notification preferences and retrieving in-app
    notifications. This is the v1 contract.

    All endpoints require a valid Bearer token minted by auth-service.
    User identity is derived from the JWT — no user ID in the path.

servers:
  - url: /
    description: All paths are routed to notification-service:8084.

security:
  - bearerAuth: []

tags:
  - name: Preferences
    description: Per-user notification preference toggles
  - name: Notifications
    description: In-app notification center (bell icon + dropdown)
  - name: CustomReminders
    description: User-defined, future-dated reminders attached to a job application

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ── Preference model ───────────────────────────────────────────────────────

    NotificationPreferencesResponse:
      x-implementation-status: planned
      type: object
      required:
        - weeklyDigestEmail
        - inAppNotificationsEnabled
        - interviewReminders
        - interviewReminderEmail
        - ghostedAlert
      properties:
        weeklyDigestEmail:
          type: boolean
          description: Whether the user receives a weekly digest email summarising new job matches and application updates.
        inAppNotificationsEnabled:
          type: boolean
          description: Whether in-app (bell icon) notifications are shown for real-time events.
        interviewReminders:
          type: boolean
          description: |
            Master switch for interview reminders (24h and 1h before a scheduled
            next step). When false, NO interview reminder is sent on any channel:
            this is the "disable entirely" control. When true, an in-app
            notification is created and, additionally, an email is sent only if
            `interviewReminderEmail` is also true.
        interviewReminderEmail:
          type: boolean
          description: |
            Channel choice for interview reminders. Only consulted when
            `interviewReminders` is true. When true, the reminder is also delivered
            by email (in addition to the in-app notification). When false, the
            reminder is in-app only. Ignored when `interviewReminders` is false.
        ghostedAlert:
          type: boolean
          description: Whether the user receives alerts when an application appears to be ghosted (no response after a threshold).

    UpdateNotificationPreferencesRequest:
      x-implementation-status: planned
      type: object
      description: |
        Partial or full update of the user's notification preferences.
        Supply only the fields to change, or all of them to set the full state.
      properties:
        weeklyDigestEmail:
          type: boolean
        inAppNotificationsEnabled:
          type: boolean
        interviewReminders:
          type: boolean
          description: Master enable/disable for interview reminders (all channels).
        interviewReminderEmail:
          type: boolean
          description: Whether to also email interview reminders. Only effective when interviewReminders is true.
        ghostedAlert:
          type: boolean

    # ── Notification center model ───────────────────────────────────────────────

    NotificationType:
      x-implementation-status: existing
      type: string
      description: |
        Concrete kind of an in-app notification, used by the UI to select an icon/visual
        treatment. The set may grow in future stories; clients should treat unknown
        values as SYSTEM for display purposes.

        A type is the fine-grained "what happened". For the coarse-grained "what is this
        notification about", see `NotificationCategory`, which is derived from this field
        server-side.
      enum:
        - INTERVIEW_REMINDER
        - GHOSTED_ALERT
        - APPLICATION_UPDATE
        - CUSTOM_REMINDER
        - SECURITY_RECOMMENDATION
        - SYSTEM

    NotificationCategory:
      x-implementation-status: existing
      type: string
      description: |
        Coarse-grained subject of a notification: what the notification is ABOUT, as
        opposed to `NotificationType`, which says what happened. Introduced by story #439
        so a client can decide which contextual chrome a notification row may render
        without hard-coding a list of types.

        The category is DERIVED server-side from `NotificationType`. It is not stored, not
        client-settable and never independently mutable: it is a pure function of the type,
        so the two cannot drift.

        Type to category mapping (exhaustive as of story #439):

        | NotificationType          | NotificationCategory |
        |---------------------------|----------------------|
        | `INTERVIEW_REMINDER`      | `APPLICATION`        |
        | `GHOSTED_ALERT`           | `APPLICATION`        |
        | `APPLICATION_UPDATE`      | `APPLICATION`        |
        | `CUSTOM_REMINDER`         | `APPLICATION`        |
        | `SECURITY_RECOMMENDATION` | `ACCOUNT`            |
        | `SYSTEM`                  | `ACCOUNT`            |

        `JOB_POST` is taxonomy only in story #439: the value is part of the contract and
        clients are expected to handle it, but no current `NotificationType` maps to it. It
        is reserved for future job-post-scoped notifications (for example a saved-search
        match, or a change to a job post the user is watching), which are explicitly out of
        scope for story #439. No new notification type is minted by that story.

        Semantics per value:
        - `APPLICATION`: the notification is about one of the user's job applications.
          `applicationId` is expected to be non-null and a client may render
          application-scoped context (company, job title, logo, deep link).
        - `JOB_POST`: the notification is about a job post rather than an application. A
          client must NOT render application-scoped context for it.
        - `ACCOUNT`: the notification is about the user's account or the platform itself and
          has no application or job-post subject. `applicationId` is always null, and a
          client must NOT render application-scoped context for it.

        Unknown-value rule: the enum may grow. A client that receives a category it does not
        recognise, or a response in which the field is absent (an older server), MUST fall
        back to `ACCOUNT` semantics, i.e. render no subject-scoped context. Falling back to
        `APPLICATION` is forbidden: it would make a client speculatively render an
        application identity row for a notification that has no application.
      enum:
        - APPLICATION
        - JOB_POST
        - ACCOUNT

    NotificationResponse:
      x-implementation-status: existing
      type: object
      required:
        - id
        - type
        - category
        - title
        - message
        - read
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the notification.
        type:
          $ref: '#/components/schemas/NotificationType'
        category:
          allOf:
            - $ref: '#/components/schemas/NotificationCategory'
          description: |
            Coarse-grained subject of this notification, derived server-side from `type`
            (see `NotificationCategory` for the full mapping). Required and never null:
            every type resolves to exactly one category, so the server can always compute
            it. Clients still apply the unknown-value rule (unrecognised or absent means
            treat as `ACCOUNT`) to stay safe against an older server or a future value.
          x-implementation-status: existing
        title:
          type: string
          description: Short headline for the notification.
        message:
          type: string
          description: Detail text for the notification.
        read:
          type: boolean
          description: Whether the authenticated user has marked this notification as read.
        createdAt:
          type: string
          format: date-time
          description: When the notification was created.
        applicationId:
          type: string
          format: uuid
          nullable: true
          description: |
            The application this notification refers to, when it was raised by an
            application-scoped event (interview reminder, ghosted alert, custom
            reminder). The UI uses this to deep-link to the application detail view.
            Null for notifications that are not tied to an application (for example
            SYSTEM or SECURITY_RECOMMENDATION).
          x-implementation-status: existing
        company:
          type: string
          nullable: true
          description: |
            Company name of the application this notification is tied to, resolved at
            read time from application-service. Drives the initial-based CoLogo chip
            on the notification card. Null when there is no applicationId, or when the
            application could not be resolved (deleted, not owned, or upstream
            unavailable): the UI degrades to a generic fallback icon. Field name
            matches the `company` convention used by application-service
            (JobSummary.company, StaleApplicationResponse.company).
          x-implementation-status: existing
        jobTitle:
          type: string
          nullable: true
          description: |
            Job post / application title of the tied application, resolved at read time
            from application-service, shown as the card's primary identifier. Null under
            the same conditions as `company` (no applicationId or unresolvable): the UI
            degrades to a generic label. Field name matches the `jobTitle` convention
            used by application-service internal summaries (StaleApplicationResponse,
            UpcomingNextStepItem context).
          x-implementation-status: existing
        companyLogoUrl:
          type: string
          format: uri
          nullable: true
          description: |
            Real company logo URL of the tied application, resolved at read time from
            application-service (ApplicationSummaryResponse.companyLogoUrl, frozen on the
            crawled-job snapshot at apply time). Drives the real logo image on the
            notification card's CoLogo chip. Null when there is no applicationId, when
            the application is unresolvable, or when the resolved application has no
            stored logo (manual entry, source post without a logo, or applied before the
            field was captured): the UI falls back to the initial-based CoLogo chip.
          x-implementation-status: existing

    NotificationPage:
      x-implementation-status: existing
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          description: Notifications for the requested page, ordered newest-first by createdAt.
          items:
            $ref: '#/components/schemas/NotificationResponse'
        page:
          type: integer
          format: int32
          description: Zero-based page index returned.
        size:
          type: integer
          format: int32
          description: Page size used for this response.
        totalElements:
          type: integer
          format: int64
          description: Total number of notifications matching the filter, across all pages.
        totalPages:
          type: integer
          format: int32
          description: Total number of pages available for the filter (0 when totalElements is 0).

    UnreadCountResponse:
      x-implementation-status: existing
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int64
          description: Number of notifications owned by the authenticated user with read=false.

    # ── Custom reminders (story #134) ──────────────────────────────────────────

    CustomReminderChannel:
      x-implementation-status: planned
      type: string
      description: |
        Delivery channel for a custom reminder. The set is closed for v1.
        `IN_APP` posts to the bell-icon notification center (NotificationType.CUSTOM_REMINDER).
        It is implicit and always forced server-side on every create/update: it cannot be
        removed by the client, even if omitted from the request.
        `EMAIL` sends a Qute-templated email matching the existing notification email style.
        It is the only channel a client can opt into or out of.
      enum:
        - IN_APP
        - EMAIL

    CustomReminderStage:
      x-implementation-status: planned
      type: string
      description: |
        Optional application-stage hint used by the UI to group / icon the reminder.
        Clients should treat unknown values as no stage for display purposes.
      enum:
        - SCREENING
        - INTERVIEW
        - OFFER

    CustomReminderStatus:
      x-implementation-status: planned
      type: string
      description: |
        Lifecycle status of a custom reminder.
        `SCHEDULED`: future-dated, waiting for its trigger time.
        `FIRED`: the dispatch scheduler has emitted the chosen channel(s); terminal.
        `CANCELLED`: deleted by the owner before firing; terminal.
      enum:
        - SCHEDULED
        - FIRED
        - CANCELLED

    CustomReminderResponse:
      x-implementation-status: planned
      type: object
      required:
        - id
        - applicationId
        - title
        - triggerAtUtc
        - channels
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the custom reminder.
        applicationId:
          type: string
          format: uuid
          description: |
            The application this reminder is attached to. Must belong to the
            authenticated user (verified at write time).
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Short headline shown in the bell-icon notification and the email subject.
        note:
          type: string
          maxLength: 2000
          nullable: true
          description: Optional free-text body shown in the bell notification and the email body.
        triggerAtUtc:
          type: string
          format: date-time
          description: |
            UTC instant at which the reminder is due (RFC 3339, e.g. `2026-06-25T14:30:00Z`).
            Strictly in the future at create/edit time (server-side check, see 400 errors).
            The client persists in UTC; the UI is responsible for rendering in the user's local time zone.
        channels:
          type: array
          minItems: 1
          description: |
            Channels the reminder will dispatch on when it fires. At least one channel is
            required in the request that produced this reminder. `IN_APP` is implicit and
            always forced server-side, so it is always present here even if the request
            that created/updated the reminder omitted it; `EMAIL` is the only optional
            channel. Duplicate entries are normalised server-side, e.g. a request with
            only `["EMAIL"]` normalises to `["IN_APP", "EMAIL"]`. An empty array is
            rejected at request time (400), not represented here. Master
            `NotificationPreferences` still apply at dispatch time (channel gating, see ADR).
          items:
            $ref: '#/components/schemas/CustomReminderChannel'
        stage:
          $ref: '#/components/schemas/CustomReminderStage'
        status:
          $ref: '#/components/schemas/CustomReminderStatus'
        createdAt:
          type: string
          format: date-time
          description: When the reminder was created.
        updatedAt:
          type: string
          format: date-time
          description: When the reminder was last edited.

    CreateCustomReminderRequest:
      x-implementation-status: planned
      type: object
      required:
        - applicationId
        - title
        - triggerAtUtc
        - channels
      properties:
        applicationId:
          type: string
          format: uuid
          description: Application this reminder is attached to. Must belong to the authenticated user.
        title:
          type: string
          minLength: 1
          maxLength: 200
        note:
          type: string
          maxLength: 2000
          nullable: true
        triggerAtUtc:
          type: string
          format: date-time
          description: Must be strictly in the future at request time (server clock).
        channels:
          type: array
          minItems: 1
          description: |
            At least one channel is required. `IN_APP` is implicit and always forced
            server-side: it is added to the stored set even if omitted from this array,
            and cannot be removed. `EMAIL` is the only channel a client can opt into.
            For example, `["EMAIL"]` normalises to `["IN_APP", "EMAIL"]` in the response.
            An empty array is rejected (400).
          items:
            $ref: '#/components/schemas/CustomReminderChannel'
        stage:
          $ref: '#/components/schemas/CustomReminderStage'

    UpdateCustomReminderRequest:
      x-implementation-status: planned
      type: object
      description: |
        Partial update of a not-yet-fired reminder. Any omitted field retains its current value.
        Fired or cancelled reminders cannot be edited (409 Conflict).

        Title is NOT editable (story #207, req 4): the card identifier is now the tied
        application's company + job title, so a free-text title adds little. The reminder
        keeps the `title` set at create time; edits target the body (`note`) and scheduling
        only. A `title` supplied here is ignored (not rejected) for forward compatibility
        with older clients.
      properties:
        note:
          type: string
          maxLength: 2000
          nullable: true
        triggerAtUtc:
          type: string
          format: date-time
          description: When supplied, must be strictly in the future at request time.
        channels:
          type: array
          minItems: 1
          description: |
            When supplied, replaces the reminder's channel set; when omitted, the existing
            set is kept. `IN_APP` is implicit and always forced server-side: it is added to
            the stored set even if omitted from this array, and cannot be removed. `EMAIL`
            is the only channel a client can opt into. For example, `["EMAIL"]` normalises
            to `["IN_APP", "EMAIL"]` in the response. An empty array is rejected (400).
          items:
            $ref: '#/components/schemas/CustomReminderChannel'
        stage:
          $ref: '#/components/schemas/CustomReminderStage'

    CustomReminderList:
      x-implementation-status: planned
      type: object
      required:
        - content
      properties:
        content:
          type: array
          description: |
            Reminders matching the filter. Ordered by `triggerAtUtc` ascending (next-due first)
            for upcoming lists; by `triggerAtUtc` descending when including fired/cancelled.
          items:
            $ref: '#/components/schemas/CustomReminderResponse'

    # ── Error ──────────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error title
        message:
          type: string
          description: Detail explaining what went wrong

paths:

  # ── Preferences ─────────────────────────────────────────────────────────────

  /notifications/preferences:
    get:
      tags: [Preferences]
      operationId: getNotificationPreferences
      summary: Get the authenticated user's notification preferences
      x-implementation-status: planned
      description: |
        Returns the notification preference toggles for the authenticated user.
        If the user has never set preferences, returns the default values
        (weeklyDigestEmail=true, inAppNotificationsEnabled=false,
        interviewReminders=true, interviewReminderEmail=true, ghostedAlert=true).
      responses:
        '200':
          description: Current notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '401':
          description: Missing or invalid Bearer token
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Preferences]
      operationId: updateNotificationPreferences
      summary: Update the authenticated user's notification preferences
      x-implementation-status: planned
      description: |
        Creates or replaces the user's notification preferences. All preference
        fields are accepted; any omitted field retains its current value (upsert
        semantics). On first call for a user, a preferences row is created with
        defaults for any omitted fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
      responses:
        '200':
          description: Updated notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '400':
          description: Validation error (e.g. unrecognised field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Notification center ─────────────────────────────────────────────────────

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the authenticated user's in-app notifications
      x-implementation-status: existing
      description: |
        Returns a page of the authenticated user's notifications, newest first by
        createdAt, optionally filtered by read status.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
          description: Zero-based page index.
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          description: Page size (1-100).
        - name: readStatus
          in: query
          required: false
          schema:
            type: string
            enum: [all, read, unread]
            default: all
          description: Filter by read status.
      responses:
        '200':
          description: Page of notifications, newest first
          headers:
            X-Total-Count:
              description: Total number of notifications matching the filter
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          description: Invalid query parameters (e.g. page < 0, size > 100, size < 1, or an unrecognised readStatus)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getUnreadCount
      summary: Get the authenticated user's unread notification count
      x-implementation-status: existing
      description: |
        Returns the total number of notifications owned by the authenticated user
        with read=false, across all pages.
      responses:
        '200':
          description: Unread notification count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          description: Missing or invalid Bearer token
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a single notification as read
      x-implementation-status: existing
      description: |
        Marks the given notification as read for the authenticated user. Idempotent —
        marking an already-read notification as read again still returns 204.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Notification ID.
      responses:
        '204':
          description: Notification marked as read (or already was)
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Notification not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notifications/{id}:
    delete:
      tags: [Notifications]
      operationId: deleteNotification
      summary: Delete a single notification
      x-implementation-status: existing
      description: |
        Permanently deletes the given notification, provided it is owned by the
        authenticated user. The row is removed from the notification table; this is
        not a soft delete and is not reversible.

        Ownership is enforced by an owner-scoped delete
        (`WHERE id = :id AND user_id = jwt.userId`). When no row matches, the
        response is 404 for both the "does not exist" and the "exists but is owned
        by another user" cases. A non-owner is deliberately given the same 404 as a
        truly missing id, so the API never reveals that a notification belonging to a
        different user exists (no 403). This mirrors the ownership convention already
        used by markNotificationRead and the custom-reminder path operations.

        Idempotency is not promised: deleting an id that no longer exists returns 404
        rather than 204.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Notification ID.
      responses:
        '204':
          description: Notification deleted
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Notification not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notifications/read-all:
    patch:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all of the authenticated user's notifications as read
      x-implementation-status: existing
      description: |
        Marks every unread notification owned by the authenticated user as read.
        Idempotent — even if nothing was unread, returns 204.
      responses:
        '204':
          description: All notifications marked as read (or already were)
        '401':
          description: Missing or invalid Bearer token
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Custom reminders (story #134) ───────────────────────────────────────────

  /notifications/custom-reminders:
    get:
      tags: [CustomReminders]
      operationId: listMyCustomReminders
      summary: List the authenticated user's custom reminders, optionally scoped to one application
      x-implementation-status: existing
      description: |
        Returns reminders owned by the authenticated user, by default only those
        in SCHEDULED status (i.e. not yet fired and not cancelled), ordered by
        `triggerAtUtc` ascending. Set `includeFired=true` to also return FIRED and
        CANCELLED reminders, ordered by `triggerAtUtc` descending.

        When `applicationId` is supplied, the result is additionally scoped to that
        application. The query is owner-scoped
        (`WHERE user_id = jwt.userId AND application_id = :applicationId`), so a
        request for an application owned by another user (or that does not exist)
        returns `200` with an empty list rather than `404` (see ADR 0011 addendum A1).
        When `applicationId` is omitted, all of the user's reminders are returned.
      parameters:
        - name: applicationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: |
            When supplied, restrict the result to reminders attached to this
            application (owner-scoped). When omitted, return reminders across all of
            the authenticated user's applications.
        - name: includeFired
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, also include FIRED and CANCELLED reminders.
      responses:
        '200':
          description: |
            Custom reminders for the authenticated user, scoped to `applicationId`
            when supplied. Empty list when `applicationId` is not owned by the
            authenticated user (ADR 0011 addendum A1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomReminderList'
        '401':
          description: Missing or invalid Bearer token
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [CustomReminders]
      operationId: createCustomReminder
      summary: Create a new custom reminder on an application
      x-implementation-status: existing
      description: |
        Creates a SCHEDULED reminder for the authenticated user on one of their
        applications. `triggerAtUtc` must be strictly in the future. The
        application must belong to the authenticated user (404 otherwise, to avoid
        leaking application existence to non-owners).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomReminderRequest'
      responses:
        '201':
          description: Reminder created
          headers:
            Location:
              description: Absolute path of the created reminder (`/notifications/custom-reminders/{id}`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomReminderResponse'
        '400':
          description: |
            Validation error. Examples: `triggerAtUtc` not in the future, empty
            `channels` array, `title` blank or too long, unknown channel/stage value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Application not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notifications/custom-reminders/{id}:
    get:
      tags: [CustomReminders]
      operationId: getCustomReminder
      summary: Get a single custom reminder by id
      x-implementation-status: existing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Custom reminder ID.
      responses:
        '200':
          description: The reminder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomReminderResponse'
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Reminder not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [CustomReminders]
      operationId: updateCustomReminder
      summary: Edit a SCHEDULED custom reminder
      x-implementation-status: existing
      description: |
        Partial-update semantics: any omitted field retains its current value. Only
        SCHEDULED reminders can be edited; FIRED or CANCELLED returns 409. When
        `triggerAtUtc` is supplied it must be strictly in the future at request time.

        The reminder title is NOT editable (story #207, req 4): only the body (`note`)
        and scheduling fields (`triggerAtUtc`, `channels`, `stage`) can be changed. The
        title set at create time is preserved. A `title` value in the request body is
        ignored rather than rejected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Custom reminder ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomReminderRequest'
      responses:
        '200':
          description: Updated reminder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomReminderResponse'
        '400':
          description: Validation error (e.g. `triggerAtUtc` not in the future, empty channels)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Reminder not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Reminder is not in SCHEDULED status (already FIRED or CANCELLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [CustomReminders]
      operationId: deleteCustomReminder
      summary: Cancel a SCHEDULED custom reminder
      x-implementation-status: existing
      description: |
        Cancels a SCHEDULED reminder. The row is retained (status flipped to
        CANCELLED) so it never fires after deletion. Idempotent on already-cancelled
        reminders (returns 204). FIRED reminders return 409 (they have already been
        delivered and are kept as an audit row).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Custom reminder ID.
      responses:
        '204':
          description: Reminder cancelled (or already was)
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Reminder not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Reminder has already fired and cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
