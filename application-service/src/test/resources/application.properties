# ─────────────────────────────────────────────────────────────────────────────
# Test configuration (@QuarkusTest component tests)
#
# Component tests run against a real Postgres via DevServices and mint their own
# JWTs with the bundled key pair.
# ─────────────────────────────────────────────────────────────────────────────

# ── Application ──────────────────────────────────────────────────────────────
quarkus.application.name=application-service-test
quarkus.http.test-port=0

# ── Database: DevServices Postgres, rebuilt per run ──────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.init-script-path=db/init-test.sql
quarkus.hibernate-orm.database.default-schema=applications
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=db/test-seeds.sql
quarkus.hibernate-orm.log.sql=false

# ── Security: JWT — same keys/issuer as auth-service, plus a signing key ──────
mp.jwt.verify.publickey.location=META-INF/keys/publicKey.pem
mp.jwt.verify.issuer=jobhub-auth
smallrye.jwt.sign.key.location=META-INF/keys/privateKey.pem
smallrye.jwt.new-token.issuer=jobhub-auth

# ── Outbound: job-service stub (unreachable by default; mocked in tests) ─────
quarkus.rest-client.job-service.url=http://localhost:65535
quarkus.rest-client.auth-service.url=http://localhost:65535
