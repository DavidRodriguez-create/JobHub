# ─────────────────────────────────────────────────────────────────────────────
# %dev profile — local development (mvn quarkus:dev)
# ─────────────────────────────────────────────────────────────────────────────

# ── Database: Quarkus DevServices (throwaway Postgres in a container) ─────────
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.reuse=true
quarkus.datasource.db-kind=postgresql
# Creates the schema + enum type before Hibernate starts.
quarkus.datasource.devservices.init-script-path=db/init-dev.sql

# ── Hibernate: rebuild the schema from entities, then load sample data ───────
quarkus.hibernate-orm.database.default-schema=applications
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=db/dev-seeds.sql
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true

# ── API docs: Swagger UI at /swagger ─────────────────────────────────────────
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
