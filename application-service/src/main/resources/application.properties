# ─────────────────────────────────────────────────────────────────────────────
# application-service — shared configuration (all profiles)
#
# Implements api-contracts/openapi/application-service.yaml. Profile-specific keys
# live in application-dev.properties (%dev) and application-prod.properties (%prod);
# tests use src/test/resources/application.properties.
# ─────────────────────────────────────────────────────────────────────────────

# ── Application ──────────────────────────────────────────────────────────────
quarkus.application.name=application-service
quarkus.http.port=8083

# ── Security: JWT verification ───────────────────────────────────────────────
# Tokens are minted by auth-service; this service only verifies them. No signing key.
mp.jwt.verify.publickey.location=META-INF/keys/publicKey.pem
mp.jwt.verify.issuer=jobhub-auth

# ── Outbound: job-service REST client ────────────────────────────────────────
# Used to snapshot a crawled job post when an application is created against it.
quarkus.rest-client.job-service.url=${JOB_SERVICE_URL:http://localhost:8080}
quarkus.rest-client.job-service.scope=jakarta.enterprise.context.ApplicationScoped

# ── Outbound: auth-service REST client ───────────────────────────────────────
# Used by DELETE /applications to validate+consume a delete-all-applications
# verification code (POST /auth/account/verifications/consume). The caller's JWT
# is forwarded so auth-service identifies the user. URL is the auth host root
# (the /auth prefix is part of the client path).
quarkus.rest-client.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8082}
quarkus.rest-client.auth-service.scope=jakarta.enterprise.context.ApplicationScoped

# ── Pagination defaults ──────────────────────────────────────────────────────
application.search.default-size=20
application.search.max-size=100

# ── Logging ──────────────────────────────────────────────────────────────────
quarkus.log.category."com.davidcreate.jobhub".level=INFO
