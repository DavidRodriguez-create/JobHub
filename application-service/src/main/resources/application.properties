# ─────────────────────────────────────────────────────────────────────────────
# application-service — shared configuration (all profiles)
#
# Implements api-contracts/openapi/application-service.yaml. Profile-specific keys
# live in application-dev.properties (%dev) and application-prod.properties (%prod);
# tests use src/test/resources/application.properties.
# ─────────────────────────────────────────────────────────────────────────────

# ── Application ──────────────────────────────────────────────────────────────
quarkus.application.name=application-service
quarkus.http.port=8083

# ── Security: JWT verification ───────────────────────────────────────────────
# Tokens are minted by auth-service; this service only verifies them. No signing key.
mp.jwt.verify.publickey.location=META-INF/keys/publicKey.pem
mp.jwt.verify.issuer=jobhub-auth

# ── Outbound: job-service REST client ────────────────────────────────────────
# Used to snapshot a crawled job post when an application is created against it.
quarkus.rest-client.job-service.url=${JOB_SERVICE_URL:http://localhost:8080}
quarkus.rest-client.job-service.scope=jakarta.enterprise.context.ApplicationScoped

# ── Outbound: auth-service REST client ───────────────────────────────────────
# Used by DELETE /applications to validate+consume a delete-all-applications
# verification code (POST /auth/account/verifications/consume). The caller's JWT
# is forwarded so auth-service identifies the user. URL is the auth host root
# (the /auth prefix is part of the client path).
quarkus.rest-client.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8082}
quarkus.rest-client.auth-service.scope=jakarta.enterprise.context.ApplicationScoped

# ── Internal (service-to-service) endpoints ──────────────────────────────────
# Pre-shared API key required on the X-Service-Key header for /internal/* paths.
# Must match the value configured in notification-service (ADR 0008). Dev default
# below; set JOBHUB_INTERNAL_SERVICE_KEY in prod.
jobhub.internal.service-key=${JOBHUB_INTERNAL_SERVICE_KEY:dev-internal-service-key}

# ── Pagination defaults ──────────────────────────────────────────────────────
application.search.default-size=20
application.search.max-size=100

# ── Logging ──────────────────────────────────────────────────────────────────
quarkus.log.category."com.davidcreate.jobhub".level=INFO

# Attach MaskingLogFilter (@LoggingFilter name) to the console handler so personal
# data / secrets are redacted from every line — including the outbound rest-client
# request/response logs below. @LoggingFilter only registers the filter — this key
# is what actually binds it to the handler.
quarkus.log.console.filter=masking-log-filter

# HTTP access log — one line per incoming request (host, user, "METHOD path proto", status, bytes, time)
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %u "%r" %s %b %D ms
quarkus.http.record-request-start-time=true

# Per-endpoint request/response logging (RequestLoggingFilter): handler name + masked
# JSON payload + status + latency. Payloads are capped at body-limit chars; personal
# data is redacted by MaskingLogFilter. Disable with request-log.enabled=false.
jobhub.http.request-log.enabled=true
jobhub.http.request-log.body-limit=2000

# Slow-request WARN: one WARNING per request whose latency reaches the threshold, independent
# of request-log.enabled (works even with verbose per-endpoint logging switched off).
jobhub.http.slow-request.enabled=true
jobhub.http.slow-request.threshold-ms=1000

# REST-client logging — log every outgoing call (to job-service and auth-service) with request + response
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=1024
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG
