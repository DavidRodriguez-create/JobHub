quarkus.application.name=auth-service-test
quarkus.http.test-port=0
quarkus.http.root-path=/auth
quarkus.http.non-application-root-path=${quarkus.http.root-path}/q

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.init-script-path=db/init-test.sql

quarkus.hibernate-orm.database.default-schema=auth
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=db/test-seeds.sql
quarkus.hibernate-orm.log.sql=false

# JWT
mp.jwt.verify.publickey.location=META-INF/keys/publicKey.pem
mp.jwt.verify.issuer=jobhub-auth
smallrye.jwt.sign.key.location=META-INF/keys/privateKey.pem
smallrye.jwt.new-token.issuer=jobhub-auth
smallrye.jwt.new-token.lifespan=86400

auth.token.lifespan-seconds=86400
auth.bcrypt.cost=4

auth.verification.email-token-ttl-seconds=86400
auth.verification.code-ttl-seconds=900

jobhub.internal.service-key=test-internal-key

# TOTP two-factor authentication (ADR 0012)
auth.totp.issuer=JobHub
auth.totp.encryption-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
auth.totp.challenge-ttl-minutes=5

# Social login (ADR 0027, story #459). Both providers "configured" by default (non-blank
# client id/secret) so the happy-path component tests exercise the real flow; the
# unconfigured-provider case (TC-459-A4/B3) overrides one provider's client-id to blank
# via a dedicated @TestProfile. rest-client URLs default to an unreachable port; the
# shared WireMock test resource overrides them to the stub server for OAuth component tests.
auth.oauth.redirect-base-url=http://localhost:5173
auth.oauth.google.client-id=test-google-client-id
auth.oauth.google.client-secret=test-google-client-secret
auth.oauth.google.authorize-url=https://accounts.google.com/o/oauth2/v2/auth
auth.oauth.google.scope=openid email profile
quarkus.rest-client.google-oauth-token.url=http://localhost:65535
quarkus.rest-client.google-oauth-userinfo.url=http://localhost:65535

auth.oauth.github.client-id=test-github-client-id
auth.oauth.github.client-secret=test-github-client-secret
auth.oauth.github.authorize-url=https://github.com/login/oauth/authorize
auth.oauth.github.scope=read:user user:email
quarkus.rest-client.github-oauth-token.url=http://localhost:65535
quarkus.rest-client.github-oauth-api.url=http://localhost:65535
