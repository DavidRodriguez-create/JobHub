quarkus.application.name=auth-service
quarkus.http.port=8082

# apply_profile.languages is JSONB mapped to List<String> (story #336). We don't
# customize REST JSON serialization for this app, so the DB-side (de)serializer can
# safely reuse Quarkus' default Jackson mapper instead of requiring a dedicated one.
quarkus.hibernate-orm.mapping.format.global=ignore

# All contract paths live under /auth (matches OpenAPI server URL).
quarkus.http.root-path=/auth
quarkus.http.non-application-root-path=${quarkus.http.root-path}/q

# JWT
mp.jwt.verify.publickey.location=META-INF/keys/publicKey.pem
mp.jwt.verify.issuer=jobhub-auth
smallrye.jwt.sign.key.location=META-INF/keys/privateKey.pem
smallrye.jwt.new-token.issuer=jobhub-auth
smallrye.jwt.new-token.lifespan=86400

# Auth tunables
auth.token.lifespan-seconds=86400
auth.bcrypt.cost=12

# Admin allowlist (ADR 0003): comma-separated emails, case-insensitive match.
# Empty (default) = no admins. Restart-to-reload only — see ADR 0003.
auth.admin.emails=${AUTH_ADMIN_EMAILS:}

# Pre-shared API key for service-to-service calls to /internal/* endpoints (ADR 0008).
# Must match the value configured in any service that calls these endpoints
# (e.g. notification-service's jobhub.internal.service-key).
jobhub.internal.service-key=${JOBHUB_INTERNAL_SERVICE_KEY:dev-internal-service-key}

# Verification tunables
# code-ttl: lifetime of any 6-digit code (verify-email and destructive actions; contract: 15 min)
auth.verification.code-ttl-seconds=900
# verify-max-attempts: failed verify-email attempts before 429 is returned (per in-memory counter)
auth.verification.verify-max-attempts=5
# resend-max-attempts: resend calls before 429 is returned (per in-memory counter)
auth.verification.resend-max-attempts=5

# TOTP two-factor authentication (ADR 0012)
# issuer: shown in the authenticator app next to the account label
auth.totp.issuer=JobHub
# encryption-key: 32-byte (256-bit) AES key, hex-encoded (64 hex chars). Must be
# provisioned via TOTP_ENCRYPTION_KEY in production — the default below is dev-only.
auth.totp.encryption-key=${TOTP_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
# challenge-ttl-minutes: lifetime of the short-lived login/2fa challenge token
auth.totp.challenge-ttl-minutes=5

# Service-to-service 2FA verify (ADR 0019, internal/two-factor/verify). Mirrors
# auth.verification.verify-max-attempts: failed attempts before 429, per in-memory
# counter keyed by userId.
auth.two-factor.verify-max-attempts=5

# Logging
quarkus.log.category."com.davidcreate.jobhub".level=INFO

# Attach MaskingLogFilter (@LoggingFilter name) to the console handler so personal
# data / secrets are redacted from every line. @LoggingFilter only registers the
# filter — this key is what actually binds it to the handler.
quarkus.log.console.filter=masking-log-filter

# HTTP access log — one line per incoming request (host, user, "METHOD path proto", status, bytes, time)
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %u "%r" %s %b %D ms
quarkus.http.record-request-start-time=true

# Per-endpoint request/response logging (RequestLoggingFilter): handler name + masked
# JSON payload + status + latency. Payloads are capped at body-limit chars; personal
# data is redacted by MaskingLogFilter. Disable with request-log.enabled=false.
jobhub.http.request-log.enabled=true
jobhub.http.request-log.body-limit=2000

# Slow-request WARN: one WARNING per request whose latency reaches the threshold, independent
# of request-log.enabled (works even with verbose per-endpoint logging switched off).
jobhub.http.slow-request.enabled=true
jobhub.http.slow-request.threshold-ms=1000

# Social login (OAuth authorization-code flow, ADR 0027, story #459). Client id/secret
# default empty (dev placeholders, no real secrets) — a provider with a blank id/secret
# is treated as unconfigured (404, OAUTH-START-3). redirect-base-url is the UI origin
# the provider redirects back to (server-side code exchange, no JWT in the URL).
auth.oauth.redirect-base-url=${OAUTH_REDIRECT_BASE_URL:http://localhost:5173}

auth.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
auth.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
auth.oauth.google.authorize-url=https://accounts.google.com/o/oauth2/v2/auth
auth.oauth.google.scope=openid email profile
quarkus.rest-client.google-oauth-token.url=https://oauth2.googleapis.com
quarkus.rest-client.google-oauth-userinfo.url=https://openidconnect.googleapis.com

auth.oauth.github.client-id=${GITHUB_OAUTH_CLIENT_ID:}
auth.oauth.github.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
auth.oauth.github.authorize-url=https://github.com/login/oauth/authorize
# user:email is required to resolve a usable email via /user/emails (BR3).
auth.oauth.github.scope=read:user user:email
quarkus.rest-client.github-oauth-token.url=https://github.com
quarkus.rest-client.github-oauth-api.url=https://api.github.com
