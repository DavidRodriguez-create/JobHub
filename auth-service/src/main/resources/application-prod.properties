# application-prod.properties

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL}
quarkus.datasource.username=${DATABASE_USERNAME}
quarkus.datasource.password=${DATABASE_PASSWORD}

# Hibernate
quarkus.hibernate-orm.database.default-schema=auth
quarkus.hibernate-orm.database.generation=validate

# JWT keys come from env in prod (override the dev/test classpath defaults)
# Provide SMALLRYE_JWT_SIGN_KEY_LOCATION and MP_JWT_VERIFY_PUBLICKEY_LOCATION

# Mailer (prod SMTP — all values from environment, never committed).
# DevOps #26 must supply these env vars; missing values will prevent email delivery.
quarkus.mailer.from=${MAILER_FROM}
quarkus.mailer.host=${MAILER_HOST}
quarkus.mailer.port=${MAILER_PORT}
quarkus.mailer.username=${MAILER_USERNAME}
quarkus.mailer.password=${MAILER_PASSWORD}
quarkus.mailer.start-tls=${MAILER_START_TLS:REQUIRED}
