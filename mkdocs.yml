site_name: JobHub
site_description: Multi-service job-tracking platform — architecture, development & API reference.
site_url: https://davidrodriguez-create.github.io/JobHub/
repo_url: https://github.com/DavidRodriguez-create/JobHub
repo_name: DavidRodriguez-create/JobHub
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - swagger-ui-tag

hooks:
  - docs/hooks/copy_openapi.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Hexagonal (Ports & Adapters): architecture/hexagonal.md
      - Clean (Concentric layers): architecture/clean.md
      - Decision records: architecture/adr/index.md
  - Development:
      - Local setup: development/local-setup.md
      - Conventions: development/conventions.md
      - Testing: development/testing.md
      - Adding a feature: development/adding-a-feature.md
      - Documentation site: development/docs-site.md
  - Services:
      - crawler-service: services/crawler.md
      - job-service: services/job.md
      - auth-service: services/auth.md
      - application-service: services/application.md
      - notification-service: services/notification.md
  - API reference:
      - auth-service: api/auth.md
      - job-service: api/job.md
      - application-service: api/application.md
      - notification-service: api/notification.md
  - Deployment: deployment.md
