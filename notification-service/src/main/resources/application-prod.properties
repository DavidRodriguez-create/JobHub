# ─────────────────────────────────────────────────────────────────────────────
# %prod profile — container / deployed runtime
#
# The schema is owned by db/init/040-notification.sql (applied once on first DB
# start); Hibernate only validates against it, never mutates it.
# ─────────────────────────────────────────────────────────────────────────────

# ── Database: connection from environment ────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=3
quarkus.datasource.username=${DATABASE_USERNAME}
quarkus.datasource.password=${DATABASE_PASSWORD}

# ── Hibernate: validate only (DDL is owned by db/init) ───────────────────────
quarkus.hibernate-orm.database.generation=validate

# ── Email: SMTP configuration from environment ──────────────────────────────
# Real sending is the DEFAULT: quarkus.mailer.mock defaults to false, so the service
# always attempts a genuine SMTP send using the NOTIFICATION_MAILER_* values below. If
# SMTP is missing or misconfigured the send FAILS LOUDLY (an exception is thrown and
# logged at ERROR) — it does NOT silently fall back to a fake/mocked send. Supply real
# values via .env / the secrets manager (NOTIFICATION_MAILER_HOST/USERNAME/PASSWORD/FROM).
# NOTIFICATION_MAILER_MOCK=true is an explicit opt-in only (e.g. a CI smoke run); it is
# never the default.
quarkus.mailer.from=${NOTIFICATION_MAILER_FROM:digest@jobhub.local}
quarkus.mailer.host=${NOTIFICATION_MAILER_HOST:}
quarkus.mailer.port=${NOTIFICATION_MAILER_PORT:587}
quarkus.mailer.username=${NOTIFICATION_MAILER_USERNAME:}
quarkus.mailer.password=${NOTIFICATION_MAILER_PASSWORD:}
quarkus.mailer.start-tls=${NOTIFICATION_MAILER_START_TLS:REQUIRED}
quarkus.mailer.mock=${NOTIFICATION_MAILER_MOCK:false}
