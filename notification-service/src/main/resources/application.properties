# ─────────────────────────────────────────────────────────────────────────────
# notification-service — shared configuration (all profiles)
#
# Implements api-contracts/openapi/notification-service.yaml. Profile-specific keys
# live in application-dev.properties (%dev) and application-prod.properties (%prod);
# tests use src/test/resources/application.properties.
# ─────────────────────────────────────────────────────────────────────────────

# ── Application ──────────────────────────────────────────────────────────────
quarkus.application.name=notification-service
quarkus.http.port=8084

# ── Database schema (isolated per service for least privilege) ───────────────
quarkus.hibernate-orm.database.default-schema=notification

# ── Security: JWT verification ───────────────────────────────────────────────
# Tokens are minted by auth-service; this service only verifies them. No signing key.
mp.jwt.verify.publickey.location=META-INF/keys/publicKey.pem
mp.jwt.verify.issuer=jobhub-auth

# ── Logging ──────────────────────────────────────────────────────────────────
quarkus.log.category."com.davidcreate.jobhub".level=INFO

# Attach MaskingLogFilter (@LoggingFilter name) to the console handler so personal
# data / secrets are redacted from every line.
quarkus.log.console.filter=masking-log-filter

# HTTP access log — one line per incoming request
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %u "%r" %s %b %D ms
quarkus.http.record-request-start-time=true

# Per-endpoint request/response logging (RequestLoggingFilter)
jobhub.http.request-log.enabled=true
jobhub.http.request-log.body-limit=2000

# Slow-request WARN: one WARNING per request whose latency reaches the threshold, independent
# of request-log.enabled (works even with verbose per-endpoint logging switched off).
jobhub.http.slow-request.enabled=true
jobhub.http.slow-request.threshold-ms=1000

# ── Notification center (Story #79) ─────────────────────────────────────────
notification.list.max-size=100

# ── Weekly digest email (Story #80) ──────────────────────────────────────────
notification.digest.enabled=true
notification.digest.cron=0 0 8 ? * MON
notification.digest.max-jobs=10
notification.digest.jobhub-base-url=http://localhost:5173

# ── Interview reminders (Story #81) ──────────────────────────────────────────
# Kill switch: set to false to disable all interview reminder sends (AC-18).
notification.interview-reminder.enabled=true
# Hourly cron: runs every hour on the hour (ADR 0009).
notification.interview-reminder.cron=0 0 * ? * *
# Forward window in hours for fetching upcoming next steps (default 26h covers
# both H24 and H1 offsets with a 2h tolerance for scheduler drift).
notification.interview-reminder.within-hours=26

# Pre-shared secret for X-Service-Key on internal endpoints (auth/application-service).
notification.internal.service-key=${JOBHUB_INTERNAL_SERVICE_KEY:dev-internal-service-key}

# ── Ghosted alert scheduler (Story #82) ──────────────────────────────────────
notification.ghosted.enabled=true
notification.ghosted.cron=0 0 2 * * ?

# ── Security recommendation scheduler (Story #133, ADR 0012) ─────────────────
notification.security-recommendation.enabled=true
notification.security-recommendation.cron=0 0 9 * * ?

# ── Custom reminders (Story #134) ────────────────────────────────────────────
# Kill switch: set to false to disable the dispatch scheduler.
notification.custom-reminder.enabled=true
# One-minute tick: tolerance is the same minute.
notification.custom-reminder.cron=0 * * ? * *
notification.custom-reminder.batch-size=200
notification.custom-reminder.title.max-length=200
notification.custom-reminder.note.max-length=2000

# ── Outbound REST clients (internal endpoints + job search) ──────────────────
quarkus.rest-client.auth-internal.url=${AUTH_SERVICE_BASE_URL:http://localhost:8082}
quarkus.rest-client.app-internal.url=${APPLICATION_SERVICE_BASE_URL:http://localhost:8083}
# headOwner returns the raw Response (204/404 are both valid outcomes, not errors);
# disable the default 4xx/5xx-to-exception mapping for this client.
quarkus.rest-client.app-internal.disable-default-mapper=true
quarkus.rest-client.app-stale.url=${APPLICATION_SERVICE_BASE_URL:http://localhost:8083}
quarkus.rest-client.job-service.url=${JOB_SERVICE_BASE_URL:http://localhost:8081}
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=1024
