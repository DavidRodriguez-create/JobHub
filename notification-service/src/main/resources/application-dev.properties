# ─────────────────────────────────────────────────────────────────────────────
# %dev profile — local development (mvn quarkus:dev)
# ─────────────────────────────────────────────────────────────────────────────

# ── Database: Quarkus DevServices (throwaway Postgres in a container) ─────────
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.reuse=false
quarkus.datasource.db-kind=postgresql
# Creates the schema before Hibernate starts.
quarkus.datasource.devservices.init-script-path=db/init-dev.sql

# ── Hibernate: rebuild the schema from entities, then load sample data ───────
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=db/dev-seeds.sql
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true

# ── API docs: Swagger UI at /swagger ─────────────────────────────────────────
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger

# ── Email: mock mode (emails logged, not sent) ──────────────────────────────
quarkus.mailer.mock=true

# ── Interview reminders: disable cron in dev to prevent unexpected firing ────
# Override the kill switch per dev preference; cron still disabled in test.
# notification.interview-reminder.enabled=false
