# ─────────────────────────────────────────────────────────────────────────────
# Test configuration (@QuarkusTest component tests)
#
# Component tests run against a real Postgres via DevServices and mint their own
# JWTs with the bundled key pair.
# ─────────────────────────────────────────────────────────────────────────────

# ── Application ──────────────────────────────────────────────────────────────
quarkus.application.name=notification-service-test
quarkus.http.test-port=0

# jackson-annotations is resolved twice at test time: once by the plain JVM application
# classloader (because @QuarkusTest test sources import api-contracts model classes such
# as ApplicationStatus directly, which pulls in jackson-annotations as part of normal class
# loading) and once again inside the isolated QuarkusClassLoader used to run the deployed
# application/REST client. The two loaders produce two distinct Class objects for
# com.fasterxml.jackson.annotation.JsonCreator/JsonValue even though there is a single jar
# on the classpath. Jackson's annotation introspection (Method#isAnnotationPresent) is
# identity-based, so the @JsonCreator/@JsonValue instances woven onto ApplicationStatus
# under one loader are invisible when looked up against the other loader's JsonCreator
# Class, which silently falls back to the default case-sensitive EnumDeserializer and
# breaks deserialization of lowercase wire values like "applied"/"interviewing". Forcing
# jackson-annotations onto the parent (shared) classloader keeps a single Class instance
# for these annotations across both test and application code.
quarkus.class-loading.parent-first-artifacts=com.fasterxml.jackson.core:jackson-annotations

# ── Database: DevServices Postgres, rebuilt per run ──────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.init-script-path=db/init-test.sql
quarkus.hibernate-orm.database.default-schema=notification
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=db/test-seeds.sql
quarkus.hibernate-orm.log.sql=false

# ── Security: JWT — same keys/issuer as auth-service, plus a signing key ──────
mp.jwt.verify.publickey.location=META-INF/keys/publicKey.pem
mp.jwt.verify.issuer=jobhub-auth
smallrye.jwt.sign.key.location=META-INF/keys/privateKey.pem
smallrye.jwt.new-token.issuer=jobhub-auth

# ── Weekly digest email (Story #80) ──────────────────────────────────────────
notification.digest.enabled=true
notification.digest.cron=0 0 8 ? * MON
notification.digest.max-jobs=10
notification.digest.jobhub-base-url=http://localhost:5173
notification.internal.service-key=test-internal-service-key

# ── Ghosted alert scheduler (Story #82) ──────────────────────────────────────
notification.ghosted.enabled=true
notification.ghosted.cron=0 0 2 * * ?

# ── Security recommendation scheduler (Story #133, ADR 0012) ─────────────────
# Disabled by default in tests: component tests inject the use case/scheduler directly.
notification.security-recommendation.enabled=false
notification.security-recommendation.cron=0 0 9 * * ?

# ── Interview reminders (Story #81) ──────────────────────────────────────────
notification.interview-reminder.enabled=true
notification.interview-reminder.cron=0 0 * ? * *
notification.interview-reminder.within-hours=26

# ── Custom reminders (Story #134) ────────────────────────────────────────────
# Disabled by default in tests: cases trigger the scheduler manually via
# @Inject CustomReminderDispatchScheduler. A dedicated profile re-enables for
# the kill-switch test.
notification.custom-reminder.enabled=false
notification.custom-reminder.cron=0 * * ? * *
notification.custom-reminder.batch-size=200
notification.custom-reminder.title.max-length=200
notification.custom-reminder.note.max-length=2000

# ── Outbound: auth/application/job-service stubs (unreachable by default; WireMock in tests) ─
quarkus.rest-client.auth-internal.url=http://localhost:65535
quarkus.rest-client.app-internal.url=http://localhost:65535
quarkus.rest-client.app-stale.url=http://localhost:65535
quarkus.rest-client.job-service.url=http://localhost:65535
# headOwner returns the raw Response (204/404 are both valid outcomes, not errors).
quarkus.rest-client.app-internal.disable-default-mapper=true
