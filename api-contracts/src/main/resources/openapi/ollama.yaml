openapi: 3.0.3
info:
  title: Ollama Chat API (external)
  version: 1.0.0
  description: |
    Minimal contract for the subset of the local Ollama HTTP API that JobHub
    consumes (POST /api/chat). This is an EXTERNAL API we call, not one we serve —
    it lives here so the request/response models are generated from a single
    source of truth, like every other contract in this module.

tags:
  - name: Chat
    description: Generate a chat completion

paths:
  /api/chat:
    post:
      tags: [Chat]
      operationId: chat
      summary: Generate a single (non-streamed) chat completion
      x-implementation-status: existing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: The model's reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'

components:
  schemas:

    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: Name of the model to run, e.g. "llama3.2"
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          description: When false, the full reply is returned in one response
        format:
          description: |
            Output format constraint — the string "json" for free JSON, or a JSON
            Schema object to constrain the structure. Untyped on purpose.
        options:
          $ref: '#/components/schemas/ChatOptions'

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          description: 'One of: system, user, assistant'
        content:
          type: string

    ChatOptions:
      type: object
      properties:
        temperature:
          type: number
          format: double
          description: Sampling temperature; 0 for deterministic extraction

    ChatResponse:
      type: object
      properties:
        model:
          type: string
        done:
          type: boolean
        message:
          $ref: '#/components/schemas/ChatMessage'
        done_reason:
          type: string
          description: Why generation stopped, e.g. "stop" or "length"
        prompt_eval_count:
          type: integer
          description: Number of tokens in the prompt (input tokens)
        eval_count:
          type: integer
          description: Number of tokens in the response (output tokens)
        total_duration:
          type: integer
          format: int64
          description: Total time spent generating the response, in nanoseconds
        load_duration:
          type: integer
          format: int64
          description: Time spent loading the model, in nanoseconds
