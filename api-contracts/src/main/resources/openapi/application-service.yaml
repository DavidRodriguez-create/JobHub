openapi: 3.0.3
info:
  title: JobHub — Application Service
  version: 1.0.0
  description: |
    REST API for tracking job applications and retrieving aggregate statistics
    for the Dashboard.

    This is the v1 contract. Every endpoint and field below is implemented by the service.

servers:
  - url: /
    description: All paths are routed to application-service:8083.

security:
  - bearerAuth: []

tags:
  - name: Applications
    description: Track job applications (crawled-job and manual)
  - name: Stats
    description: Aggregate metrics for the Dashboard screen
  - name: Internal
    description: |
      Service-to-service endpoints. Protected by a pre-shared API key
      (`X-Service-Key` header) rather than a user JWT. Not exposed to the
      internet or the UI — only called by other JobHub backend services on
      the same network.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceKeyAuth:
      type: apiKey
      in: header
      name: X-Service-Key
      description: |
        Pre-shared API key for service-to-service calls. The value must match the
        deployment secret (`JOBHUB_INTERNAL_SERVICE_KEY` env var). Used by internal
        endpoints that do not require a user JWT.

  schemas:

    # ── Status enum ────────────────────────────────────────────────────────────

    ApplicationStatus:
      type: string
      description: |
        Application pipeline status. Terminal states are `rejected`, `accepted`,
        `withdrawn`, and `ghosted` (these stamp `endedAt`).

        **Naming alignment needed:**
        - UI sends `interview` — backend stores `interviewing`
        - UI sends `offer`     — backend stores `offered`

        Backend enum is the source of truth; the UI must align.
      enum:
        - applied
        - screening
        - interviewing
        - offered
        - rejected
        - accepted
        - withdrawn
        - ghosted

    # ── Response schemas ───────────────────────────────────────────────────────

    ApplicationResponse:
      x-implementation-status: existing
      type: object
      required: [id, status, appliedAt, createdAt, updatedAt, job]
      properties:
        id:
          type: string
          format: uuid
        jobPostId:
          type: string
          format: uuid
          nullable: true
          description: |
            The originating job-service job post id, for crawled-job applications. Null for
            manual entries. Lets clients map an application back to a row in job search
            (e.g. to mark it "Applied" and prevent re-applying).
        jobPostSnapshotId:
          type: string
          format: uuid
          nullable: true
          description: Populated for crawled-job applications. Null for manual entries.
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        appliedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when status reaches a terminal state (rejected/accepted/withdrawn/ghosted)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        job:
          description: |
            Unified job info for display. Always present — the list view depends on it.
            For crawled-job applications this is a frozen snapshot taken at application time.
            For manual entries it reflects the current state of the user-entered job details (always live).
          allOf:
            - $ref: '#/components/schemas/JobSummary'
        notes:
          type: string
          description: Freeform notes shown in the application detail view.
        nextStep:
          description: Upcoming action shown on kanban cards and the Dashboard coming-up widget.
          allOf:
            - $ref: '#/components/schemas/NextStep'
        contact:
          type: string
          maxLength: 200
          description: Recruiter or contact name shown in the detail view.
        portalUrl:
          type: string
          format: uri
          maxLength: 2000
          description: URL of the company's application portal, if different from the job post URL.
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
          description: |
            Ordered list of status-change events, oldest first. Populated automatically
            by each call to `PATCH /applications/{id}/status`.
            Only populated on `GET /applications/{id}` — omitted from the list response.

    JobSummary:
      description: |
        Minimal job info embedded in ApplicationResponse. Always populated — required for the application list view.
        For crawled-job applications the data is frozen at application time.
        For manual-entry applications the data reflects the current state of the user-entered job details.
      type: object
      properties:
        title:
          type: string
        company:
          type: string
        companyLogoUrl:
          type: string
          format: uri
          nullable: true
          description: |
            Real company logo URL. For crawled-job applications it is the value frozen
            on the snapshot at apply time (from job-service CompanyInfo.logoUrl); null
            for manual entries, for source posts that had no logo, and for applications
            created before this field was captured.
          x-implementation-status: planned
        location:
          type: string
          description: "e.g. 'Barcelona, Spain' or 'Remote'"
        url:
          type: string
          format: uri

    NextStep:
      type: object
      properties:
        label:
          type: string
          maxLength: 200
          description: "e.g. 'Technical interview', 'Send portfolio'"
        date:
          type: string
          format: date
          nullable: true
        reminderAt:
          type: string
          format: date-time
          nullable: true
          description: When to notify the user about this step. Optional — if omitted no reminder is sent.

    TimelineEntry:
      type: object
      required: [status, occurredAt]
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        occurredAt:
          type: string
          format: date-time

    ApplicationPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    ApplicationStatsResponse:
      x-implementation-status: existing
      type: object
      properties:

        # ── Pipeline ──────────────────────────────────────────────────────────
        total:
          type: integer
          format: int64
          description: Total number of applications ever created.
        activeCount:
          type: integer
          description: Applications in non-terminal states (excludes rejected/accepted/withdrawn/ghosted).
        byStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: "Map of status → count, e.g. {\"applied\": 4, \"interviewing\": 3}"

        # ── Monthly activity ──────────────────────────────────────────────────
        monthlyNew:
          type: integer
          description: Applications created in the current calendar month.

        # ── Rates & timings ───────────────────────────────────────────────────
        responseRate:
          type: number
          format: double
          description: Percentage of applications that received any response (moved past `applied`).
        avgReplyDays:
          type: number
          format: double
          description: Average days between `appliedAt` and the first status change.
        passThrough:
          type: number
          format: double
          description: Percentage of applications that reached `offered` status (offer rate).

        # ── Upcoming ──────────────────────────────────────────────────────────
        nextDeadline:
          description: |
            Earliest upcoming `nextStep.date` across all active applications.
            Used for the 'Respond by …' label on the Offers card.
          allOf:
            - $ref: '#/components/schemas/NextDeadline'


    NextDeadline:
      description: The earliest upcoming nextStep.date across all active applications.
      type: object
      properties:
        date:
          type: string
          format: date
        applicationId:
          type: string
          format: uuid

    MonthlyCount:
      x-implementation-status: existing
      type: object
      required: [year, month, byStatus]
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        byStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: "Count per status for this month, e.g. {\"applied\": 5, \"interviewing\": 2, \"rejected\": 1}"

    # ── Request schemas ────────────────────────────────────────────────────────

    CreateApplicationRequest:
      x-implementation-status: existing
      type: object
      description: |
        Supply either `jobPostId` (application to a crawled job post) or `jobDetails`
        (manually entered job) — exactly one must be provided.
        For manual entries the job details are stored as a mutable record accessible
        and updatable via `/applications/{id}/job`.
      properties:
        jobPostId:
          type: string
          format: uuid
          description: ID of the crawled job post being applied to.
        jobDetails:
          description: Job details for a manual-entry application. Ignored if `jobPostId` is set.
          allOf:
            - $ref: '#/components/schemas/JobDetailsRequest'

    UpdateApplicationStatusRequest:
      x-implementation-status: existing
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatus'

    UpdateApplicationRequest:
      description: |
        Partial update payload for the editable fields of an application. Supply only the fields to change.
        Status changes use the dedicated `PATCH /applications/{id}/status` endpoint
        so that each status change is recorded in the timeline.
        Job details of a manual-entry application are updated via `PATCH /applications/{id}/job`.
      type: object
      properties:
        notes:
          type: string
          maxLength: 5000
        appliedAt:
          type: string
          format: date-time
          description: Correct the applied date if it was entered wrong.
        nextStep:
          $ref: '#/components/schemas/NextStep'
        contact:
          type: string
          maxLength: 200
        portalUrl:
          type: string
          format: uri
          maxLength: 2000

    JobDetailsRequest:
      x-implementation-status: existing
      description: |
        Job details entered manually by the user. All fields are optional —
        provide at least `title` or `url` on creation.
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        company:
          type: string
          maxLength: 200
        url:
          type: string
          format: uri
          maxLength: 2000
          description: Job posting URL
        location:
          type: string
          maxLength: 200
          description: "Location of the role, e.g. 'Barcelona, Spain' or 'Remote'"

    # ── Verification ──────────────────────────────────────────────────────────

    VerifiedActionRequest:
      type: object
      required: [verificationId, code]
      properties:
        verificationId:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^\d{6}$'
          description: The 6-digit code sent to the user's registered email address.

    # ── Internal: interest profile ────────────────────────────────────────────

    InterestProfileResponse:
      x-implementation-status: existing
      type: object
      required: [userId, locations, companies, keywords]
      properties:
        userId:
          type: string
          format: uuid
        locations:
          type: array
          items:
            type: string
          maxItems: 5
          description: |
            Top locations from the user's application history, ordered by frequency
            (most applied-to first). Derived from job snapshot and manual-entry
            locations. Empty if the user has no applications.
        companies:
          type: array
          items:
            type: string
          maxItems: 5
          description: |
            Top companies from the user's application history, ordered by frequency.
            Derived from job snapshot and manual-entry companies.
            Empty if the user has no applications.
        keywords:
          type: array
          items:
            type: string
          maxItems: 5
          description: |
            Top keywords extracted from job titles in the user's application history,
            ordered by frequency. Common stop words are excluded. Empty if the user
            has no applications.

    StaleApplicationResponse:
      x-implementation-status: planned
      type: object
      required: [id, userId, jobTitle, company, currentStatus, daysSinceLastActivity]
      description: |
        Summary of a non-terminal application whose `updatedAt` has not changed for
        longer than the requested window. Used by notification-service's ghosted-alert
        scheduler to decide which applications to auto-mark GHOSTED.
      properties:
        id:
          type: string
          format: uuid
          description: Application id.
        userId:
          type: string
          format: uuid
          description: Owner of the application — the user to notify.
        jobTitle:
          type: string
          description: Job title for the notification/email body (from snapshot or manual entry).
        company:
          type: string
          description: Company name for the notification/email body.
        currentStatus:
          $ref: '#/components/schemas/ApplicationStatus'
        daysSinceLastActivity:
          type: integer
          format: int32
          minimum: 0
          description: Whole days since `updatedAt`, computed server-side at query time.

    StaleApplicationListResponse:
      x-implementation-status: planned
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaleApplicationResponse'

    ApplicationSummaryResponse:
      x-implementation-status: planned
      type: object
      required: [applicationId, company, jobTitle]
      description: |
        Compact display summary for one application, resolved by id for the
        enrich-at-read path (ADR 0014). Carries the company name, job title, and
        company logo URL that a notification card needs (CoLogo chip + primary
        label + real logo image). Returned only for ids that resolve: unresolved
        ids are omitted from the list, so every item here has a populated company
        and jobTitle; `companyLogoUrl` may still be null for a resolved item.
      properties:
        applicationId:
          type: string
          format: uuid
          description: The resolved application id, echoed so callers can map results back.
        company:
          type: string
          description: Company name (from the crawled-job snapshot or the manual-entry job).
        jobTitle:
          type: string
          description: Job title (from the crawled-job snapshot or the manual-entry job).
        companyLogoUrl:
          type: string
          format: uri
          nullable: true
          description: |
            Real company logo URL frozen on the crawled-job snapshot at apply time
            (sourced from job-service CompanyInfo.logoUrl). Null for manual-entry
            applications, for crawled jobs whose source post had no logo, and for
            applications applied to before this field was captured. The UI renders
            the image when present and falls back to an initial-based chip otherwise.
          x-implementation-status: planned

    ApplicationSummaryListResponse:
      x-implementation-status: planned
      type: object
      required: [items]
      description: |
        Wrapper for the batch summary resolve. `items` holds one entry per id
        that resolved, in no guaranteed order, and may be shorter than the
        request (unresolved ids are omitted) or empty. A partial or empty list
        is a success, not an error.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationSummaryResponse'

    InternalStatusUpdateResponse:
      x-implementation-status: planned
      type: object
      required: [id, userId, newStatus]
      description: |
        Minimal confirmation returned after a service-key-authenticated status update.
        Deliberately small — the caller (notification-service) only needs to confirm the
        new status and identify the user to notify.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        newStatus:
          $ref: '#/components/schemas/ApplicationStatus'

    # ── Internal: upcoming next steps (interview reminders) ────────────────────

    UpcomingNextStepsResponse:
      x-implementation-status: planned
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingNextStepItem'
          description: |
            Applications across ALL users whose `nextStep.date` falls within the
            requested forward window, with a non-empty next-step label and a
            non-terminal status. Used by notification-service to emit 24h and 1h
            interview reminders. Empty array if nothing is upcoming in the window.

    UpcomingNextStepItem:
      x-implementation-status: planned
      type: object
      required: [userId, applicationId, nextStepLabel, nextStepDate, status]
      description: |
        One upcoming next-step occurrence for a single user's application. Carries
        everything notification-service needs to build reminder content (label,
        date, company) and to key idempotency (userId + applicationId), so no
        follow-up per-application fetch is required.
      properties:
        userId:
          type: string
          format: uuid
          description: Owner of the application (references auth.user.id).
        applicationId:
          type: string
          format: uuid
          description: The application the next step belongs to. Half of the idempotency key.
        nextStepLabel:
          type: string
          maxLength: 200
          description: "The next-step label, e.g. 'Interview with Product Manager'."
        nextStepDate:
          type: string
          format: date
          description: The calendar date of the next step (applications stores DATE, not time).
        nextStepReminderAt:
          type: string
          format: date-time
          nullable: true
          description: |
            The user-set reminder instant for this step, if any. Informational for
            the caller; the 24h/1h offsets are computed by notification-service from
            `nextStepDate`. Null when the user did not set an explicit reminder.
        companyName:
          type: string
          nullable: true
          description: |
            Company for display in the reminder ("... at Acme"). Resolved from the
            crawled-job snapshot or the manual-entry job details. Null when unknown.
        status:
          $ref: '#/components/schemas/ApplicationStatus'

    # ── Error ──────────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error title
        message:
          type: string
          description: Detail explaining what went wrong

paths:

  # ── Applications ─────────────────────────────────────────────────────────────

  /applications:
    delete:
      tags: [Applications]
      operationId: deleteAllApplications
      summary: Delete all applications for the authenticated user
      description: |
        Permanently deletes all applications and their associated data (job details, timeline).
        Requires a valid verification code obtained from `POST /auth/account/verifications`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifiedActionRequest'
      responses:
        '204':
          description: All applications deleted
        '400':
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Applications]
      operationId: createApplication
      summary: Create an application
      x-implementation-status: existing
      description: |
        Creates a new application. Supply either `jobPostId` (crawled job) or `jobDetails`
        (manual entry) — exactly one must be provided.
        For manual entries the job details are stored as a mutable record linked to this
        application, updatable later via `PATCH /applications/{id}/job`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Validation error — neither or both of jobPostId/jobDetails supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Job post not found — the supplied jobPostId does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The authenticated user already has an application for this job post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Applications]
      operationId: listApplications
      summary: List the authenticated user's applications
      x-implementation-status: existing
      description: |
        Returns a paginated list of applications belonging to the authenticated user.
        User identity is derived from the Bearer token — no user ID in the path.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
          description: Filter by status
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated application list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/stats:
    get:
      tags: [Stats]
      operationId: getApplicationStats
      summary: Aggregate statistics for the Dashboard
      x-implementation-status: existing
      description: Lightweight summary for the dashboard cards. For the historical chart use `GET /applications/stats/history`.
      responses:
        '200':
          description: Aggregate statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatsResponse'
        '401':
          description: Missing or invalid Bearer token
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/stats/history:
    get:
      tags: [Stats]
      operationId: getApplicationStatsHistory
      summary: Monthly application breakdown for the trend chart
      description: |
        Returns per-month counts broken down by status. Intended for lazy-loading
        the trend chart separately from the dashboard summary.
      parameters:
        - name: months
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
          description: Number of months of history to return, counting back from the current month.
      responses:
        '200':
          description: Monthly breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlyCount'
        '401':
          description: Missing or invalid Bearer token
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{id}:
    get:
      tags: [Applications]
      operationId: getApplication
      summary: Get a single application
      x-implementation-status: existing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Application not found or belongs to another user
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Applications]
      operationId: updateApplication
      summary: Update editable application fields
      description: |
        Partial update for notes, appliedAt, nextStep, contact, and portalUrl.
        Supply only the fields to change. Status changes use `PATCH /applications/{id}/status`.
        Job details of a manual-entry application are updated via `PATCH /applications/{id}/job`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Application not found or belongs to another user
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Applications]
      operationId: deleteApplication
      summary: Delete an application
      x-implementation-status: existing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Application deleted
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Application not found or belongs to another user
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{id}/status:
    patch:
      tags: [Applications]
      operationId: updateApplicationStatus
      summary: Update the status of an application
      x-implementation-status: existing
      description: |
        Updates the current status. Once the timeline feature is implemented, each
        call will also append a TimelineEntry.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationStatusRequest'
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Application not found or belongs to another user
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/{id}/job:
    patch:
      tags: [Applications]
      operationId: updateApplicationJob
      summary: Update the job details of a manual-entry application
      x-implementation-status: existing
      description: |
        Partial update for the job info (title, company, url, location) of a manual-entry application.
        Supply only the fields to change. Returns 409 for crawled-job applications — their snapshot is immutable.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobDetailsRequest'
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Application not found or belongs to another user
        '409':
          description: Cannot update job details on a crawled-job application — its snapshot is immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Internal (service-to-service) ──────────────────────────────────────────

  /internal/users/{userId}/interest-profile:
    get:
      tags: [Internal]
      operationId: getUserInterestProfile
      summary: Get a user's interest profile derived from application history (service-to-service)
      x-implementation-status: existing
      description: |
        Aggregates the authenticated user's application history to produce an
        interest profile: the top locations, companies, and title keywords from
        jobs they have applied to. Intended for notification-service to build
        personalised job-search queries for the weekly digest email.

        Returns 200 with empty arrays if the user has no application history —
        the caller decides whether to send a generic digest or skip.

        Protected by `X-Service-Key` (pre-shared API key), not a user JWT.
        This endpoint is not exposed to the internet or the UI.
      security:
        - serviceKeyAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID to compute the interest profile for.
      responses:
        '200':
          description: Interest profile (may have empty arrays if no history)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestProfileResponse'
        '400':
          description: Invalid userId format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid X-Service-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /internal/applications/stale:
    get:
      tags: [Internal]
      operationId: listStaleApplications
      summary: List non-terminal applications inactive for longer than a window (service-to-service)
      x-implementation-status: planned
      description: |
        Returns applications in a **non-terminal** status (excludes rejected, accepted,
        withdrawn, ghosted) whose `updatedAt` is older than `days` days. Used by
        notification-service's ghosted-alert scheduler to find candidates to auto-mark
        GHOSTED after a period of silence.

        The window is measured server-side against `updatedAt`. Each item carries the
        owning `userId` and a display-ready job title/company so the caller can build the
        notification and email without a second round-trip.

        Protected by `X-Service-Key` (pre-shared API key), not a user JWT.
        This endpoint is not exposed to the internet or the UI.
      security:
        - serviceKeyAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 14
          description: |
            Inactivity threshold in days. An application is stale when
            `daysSinceLastActivity >= days`. Defaults to 14.
      responses:
        '200':
          description: Stale applications (may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaleApplicationListResponse'
        '400':
          description: Invalid days parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid X-Service-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /internal/applications/{id}/status:
    put:
      tags: [Internal]
      operationId: updateApplicationStatusInternal
      summary: Update an application's status without a user JWT (service-to-service)
      x-implementation-status: planned
      description: |
        Sets the status of an application on behalf of the system rather than the owning
        user. The ghosted-alert scheduler calls this to set `ghosted` after the inactivity
        window elapses; notification-service has no user JWT and acts for the system.

        Unlike `PATCH /applications/{id}/status` (user-JWT, owner-scoped), this endpoint is
        authenticated by `X-Service-Key` and identifies the application solely by its id —
        there is no owner check because the caller is a trusted backend service. The owning
        `userId` is returned so the caller can notify the right user.

        Protected by `X-Service-Key` (pre-shared API key), not a user JWT.
        This endpoint is not exposed to the internet or the UI.
      security:
        - serviceKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The application id to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalStatusUpdateResponse'
        '400':
          description: Invalid status value or id format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid X-Service-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /internal/applications/upcoming-next-steps:
    get:
      tags: [Internal]
      operationId: getUpcomingNextSteps
      summary: List upcoming next steps across all users (service-to-service)
      x-implementation-status: planned
      description: |
        Returns applications across ALL users whose `nextStep.date` falls within a
        forward time window measured from now, restricted to non-empty next-step
        labels and non-terminal statuses. Intended for notification-service's
        interview-reminder scheduler to find candidates for 24h and 1h reminders.

        Read-only aggregation over existing `applications.application` columns
        (`next_step_label`, `next_step_date`, `next_step_reminder_at`, `status`,
        `user_id`) joined to the job snapshot / manual-entry job for the company
        name. No schema change.

        The window is expressed in hours (`withinHours`); the caller asks for a
        bound generous enough to cover the largest reminder offset (24h) plus its
        own poll interval, then computes the exact 24h/1h fire times locally. The
        scheduler is responsible for not re-sending: see
        `notification.interview_reminder_sent` (ADR 0009).

        Returns 200 with an empty `items` array when nothing is upcoming.

        Protected by `X-Service-Key` (pre-shared API key), not a user JWT.
        This endpoint is not exposed to the internet or the UI.
      security:
        - serviceKeyAuth: []
      parameters:
        - name: withinHours
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 26
          description: |
            Forward window size in hours from now. Default 26 covers the 24h
            reminder offset plus a 2h scheduler slack. Max 168 (one week).
      responses:
        '200':
          description: Upcoming next steps within the window (may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingNextStepsResponse'
        '400':
          description: Invalid withinHours value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid X-Service-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /internal/applications/{id}/owner/{userId}:
    head:
      tags: [Internal]
      operationId: checkApplicationOwner
      summary: Verify that an application belongs to a given user (service-to-service)
      x-implementation-status: planned
      description: |
        Returns 204 if the application identified by `id` belongs to `userId`,
        or 404 if the application does not exist or is owned by a different user.
        The two negative cases are deliberately indistinguishable to avoid leaking
        application existence to callers.

        Called by notification-service when creating a custom reminder to ensure the
        requesting user actually owns the referenced application (ADR 0011 section 7).

        HEAD is used because no body is needed; the status code is the answer.

        Protected by `X-Service-Key` (pre-shared API key), not a user JWT.
        This endpoint is not exposed to the internet or the UI.
      security:
        - serviceKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The application id to check.
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user id to check ownership against.
      responses:
        '204':
          description: Application exists and is owned by the given user
        '401':
          description: Missing or invalid X-Service-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Application not found or not owned by the given user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /internal/applications/summaries:
    get:
      tags: [Internal]
      operationId: getApplicationSummaries
      summary: Resolve company + job title for a batch of application ids (service-to-service)
      x-implementation-status: planned
      description: |
        Resolves a batch of application ids to a compact display summary
        (company name + job title) in a single call. Intended for
        notification-service's enrich-at-read path (ADR 0014): when building a
        page of notification cards, the caller collects the distinct non-null
        `applicationId`s on the page and resolves them all in one round trip
        instead of one call per notification (avoids N+1).

        Read-only aggregation over existing `applications.application` columns
        joined to the crawled-job snapshot or the manual-entry job for the
        company name and job title. No schema change.

        Batch input format: `ids` is a single comma-joined query parameter
        (`ids=<uuid>,<uuid>,...`), expressed as an OpenAPI form-style,
        non-exploded array. Each value must be a UUID.

        Unknown-id behaviour: ids that do not resolve (not found, or owned by a
        different user, or otherwise unresolvable) are **omitted** from `items`
        rather than returned as null entries. The response can therefore be
        shorter than the request, in any order. Callers map results by
        `applicationId` and treat any absent id as unresolved, degrading the
        card to a generic icon + label. A partial or empty `items` array is a
        success (200), never an error.

        Protected by `X-Service-Key` (pre-shared API key), not a user JWT.
        This endpoint is not exposed to the internet or the UI.
      security:
        - serviceKeyAuth: []
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              format: uuid
          description: |
            Comma-joined list of application ids to resolve
            (`ids=<uuid>,<uuid>,...`). Between 1 and 100 ids per call; 100
            matches the maximum notification page size, so one page resolves in
            one call. Duplicate ids may be collapsed in the response.
      responses:
        '200':
          description: |
            Resolved summaries (may be partial or empty). Contains one item per
            id that resolved; unresolved ids are omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSummaryListResponse'
        '400':
          description: Missing `ids`, malformed UUID, empty list, or more than 100 ids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid X-Service-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
